<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141412">
</head>
<body>
<title>Metodika Clubes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --suelo:#EDEAE2; --carta:#FAF8F3; --carta2:#F3F0E8; --tinta:#17160F; --sub:#6A6558; --tenue:#9C968A;
  --linea:#DCD7CA; --negro:#141412; --negro2:#1F1E1B; --amarillo:#FFD400; --amarillo-t:#FFF3B0;
  --bronce:#94652B; --verde:#2E6B4A; --verde-t:#E1EEE5; --rojo:#B3452F; --rojo-t:#F6E2DC; --ambar:#B67C0E; --ambar-t:#F7EACB;
  --cesped:#2F6B45; --cesped2:#2A613F; --raya:rgba(255,255,255,.85);
  --f-d:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --f-t:'Barlow','Segoe UI',Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --suelo:#121210; --carta:#1B1A17; --carta2:#23221E; --tinta:#EEEBE3; --sub:#A7A194; --tenue:#7A756A;
    --linea:#2F2D28; --negro:#0A0A09; --negro2:#161614; --amarillo-t:#3A3413;
    --bronce:#CF9A5C; --verde:#63AE83; --verde-t:#1D2C23; --rojo:#E48A72; --rojo-t:#3A211B; --ambar:#E0AA45; --ambar-t:#352A14;
    --cesped:#24533A; --cesped2:#204B34;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --suelo:#121210; --carta:#1B1A17; --carta2:#23221E; --tinta:#EEEBE3; --sub:#A7A194; --tenue:#7A756A;
  --linea:#2F2D28; --negro:#0A0A09; --negro2:#161614; --amarillo-t:#3A3413;
  --bronce:#CF9A5C; --verde:#63AE83; --verde-t:#1D2C23; --rojo:#E48A72; --rojo-t:#3A211B; --ambar:#E0AA45; --ambar-t:#352A14;
  --cesped:#24533A; --cesped2:#204B34;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--suelo);color:var(--tinta);font-family:var(--f-t);font-size:15px;line-height:1.45;margin:0}
h1,h2,h3,h4{font-family:var(--f-d);font-weight:700;letter-spacing:.2px;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}
.num,td.n,.tab{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Estructura ---------- */
.app{display:flex;min-height:100%}
.lateral{width:232px;flex:none;background:var(--negro);color:#EDEAE2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-block:20px 16px}
.marca{display:flex;gap:12px;align-items:center;padding:0 20px 20px;border-bottom:1px solid #2A2925}
.marca svg{width:38px;height:38px;flex:none}
.marca b{font-family:var(--f-d);font-size:22px;letter-spacing:3px;display:block;line-height:1}
.marca small{font-size:9.5px;letter-spacing:1.3px;white-space:nowrap;color:#A7A194;display:block;margin-top:4px}
.club-mini{padding:14px 20px;font-size:13px;color:#C9C4B8;border-bottom:1px solid #2A2925;display:flex;gap:10px;align-items:center}
.club-mini .esc{width:30px;height:30px;border-radius:50%;background:#2A2925;display:grid;place-items:center;overflow:hidden;flex:none;font-family:var(--f-d);font-weight:700;color:var(--amarillo)}
.club-mini .esc img{width:100%;height:100%;object-fit:cover}
.club-mini b{display:block;color:#fff;font-weight:600;line-height:1.2}
nav.menu{display:flex;flex-direction:column;gap:2px;padding:12px 10px;overflow-y:auto;flex:1}
nav.menu a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;text-decoration:none;color:#CFCABE;font-weight:500;font-size:14.5px}
nav.menu a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.menu a:hover{background:#1F1E1B;color:#fff}
nav.menu a.activo{background:var(--amarillo);color:#141412;font-weight:600}
nav.menu .sep{height:1px;background:#2A2925;margin:8px 6px}
.pie-lat{padding:10px 20px 0;font-size:11px;color:#7A756A;letter-spacing:1.5px}
main{flex:1;min-width:0;padding-block:26px 60px;padding-inline:32px}
.demo-banda{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--amarillo);color:#141412;border-radius:var(--r);padding:10px 16px;margin-bottom:22px;font-weight:500}
.demo-banda b{font-family:var(--f-d);letter-spacing:1px;text-transform:uppercase}
.demo-banda .btn{margin-left:auto;background:#141412;color:#fff;border-color:#141412}
.cab{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.cab .eyebrow{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--bronce);font-weight:600;margin-bottom:6px}
.cab .acc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.cab p{margin:6px 0 0;color:var(--sub);max-width:62ch}

/* ---------- Piezas ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--linea);background:var(--carta);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--tinta)}
.btn.pri{background:var(--negro);border-color:var(--negro);color:#fff}
.btn.pri:hover{background:#000}
:root[data-theme="dark"] .btn.pri{background:var(--amarillo);border-color:var(--amarillo);color:#141412}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{background:var(--amarillo);border-color:var(--amarillo);color:#141412}}
.btn.ama{background:var(--amarillo);border-color:var(--amarillo);color:#141412}
.btn.peligro{color:var(--rojo);border-color:var(--rojo-t)}
.btn.chico{padding:5px 10px;font-size:13px}
.btn.fantasma{background:transparent;border-color:transparent}
.btn.fantasma:hover{border-color:var(--linea)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:18px}
.panel > h3{margin-bottom:12px}
.panel-cab{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-cab h3{margin:0}
.panel-cab .der{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;max-width:100%}
.grilla{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.etq{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--sub);font-weight:600}
.dato{font-family:var(--f-d);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sub{color:var(--sub)}
.tenue{color:var(--tenue)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--carta2);border:1px solid var(--linea);white-space:nowrap}
.chip.ok{background:var(--verde-t);color:var(--verde);border-color:transparent}
.chip.mal{background:var(--rojo-t);color:var(--rojo);border-color:transparent}
.chip.aviso{background:var(--ambar-t);color:var(--ambar);border-color:transparent}
.chip.ama{background:var(--amarillo);color:#141412;border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.vacio{padding:26px;text-align:center;color:var(--sub);border:1.5px dashed var(--linea);border-radius:var(--r)}
.lista{display:flex;flex-direction:column}
.fila{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:0}
.fila .der{margin-left:auto;display:flex;gap:6px;align-items:center}
.fila.click{cursor:pointer}
.fila.click:hover{background:var(--carta2)}
.av{width:38px;height:38px;border-radius:50%;background:var(--negro);color:var(--amarillo);display:grid;place-items:center;font-family:var(--f-d);font-weight:700;font-size:15px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.g{width:84px;height:84px;font-size:30px}
.dorsal{font-family:var(--f-d);font-weight:700;font-size:15px;min-width:24px;color:var(--bronce)}
.tabla-c{overflow-x:auto;border:1px solid var(--linea);border-radius:var(--r);background:var(--carta)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--sub);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--linea);white-space:nowrap;background:var(--carta2)}
td{padding:9px 12px;border-bottom:1px solid var(--linea);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--carta2)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filtros select,.filtros input{min-width:0}
label.campo{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--sub)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input[type=url],input[type=search],select,textarea{background:var(--carta);border:1.5px solid var(--linea);border-radius:8px;padding:8px 10px;font-size:14.5px;color:var(--tinta);width:100%}
textarea{min-height:78px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--tinta);outline:none}
.form{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .ancho{grid-column:1/-1}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--linea);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs button.activo{color:var(--tinta);border-bottom-color:var(--amarillo)}
.seg{display:inline-flex;border:1.5px solid var(--linea);border-radius:8px;overflow-x:auto;max-width:100%}
.seg button{flex:none}
.seg button{border:0;background:var(--carta);padding:6px 11px;font-weight:600;font-size:13px;cursor:pointer;color:var(--sub)}
.seg button+button{border-left:1.5px solid var(--linea)}
.seg button.activo{background:var(--negro);color:#fff}
.barra{height:8px;background:var(--carta2);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde);border-radius:99px}

/* Modal */
.velo{position:fixed;inset:0;background:rgba(10,10,9,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--carta);border-radius:14px;width:100%;max-width:640px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.ancho{max-width:900px}
.modal-cab{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-cab h2{font-size:22px}
.modal-cab .x{margin-left:auto}
.modal-pie{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.aviso-t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--negro);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* Tarjetas de jugadora */
.cartas-j{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.cj{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left}
.cj:hover{border-color:var(--tinta)}
.cj b{display:block;line-height:1.2}
.cj small{color:var(--sub)}

/* Tareas */
.cartas-t{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ct{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.ct:hover{border-color:var(--tinta)}
.ct .mini{background:var(--cesped);aspect-ratio:16/10;max-width:100%}
.ct .mini svg{display:block;width:100%;height:100%}
.ct .cuerpo{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.ct h3{font-size:18px}

/* Pizarra */
.piz-wrap{display:grid;grid-template-columns:236px minmax(0,1fr);gap:16px;align-items:start}
.herr .etq{margin-top:8px}
.hg{display:grid;grid-template-columns:1fr;gap:5px}
.hg.g2h{grid-template-columns:1fr 1fr}
.hg.g3h{grid-template-columns:repeat(3,minmax(0,1fr))}
.hg.g2h button,.hg.g3h button{flex-direction:column;gap:3px;font-size:11.5px;padding:7px 3px;text-align:center;justify-content:center}
.herr button span{min-width:0;overflow-wrap:anywhere}
.colores{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--linea);cursor:pointer;padding:0;flex:none}
.sw.activo{outline:3px solid var(--tinta);outline-offset:2px}
.pasos{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.fila-sel{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.herr{display:flex;flex-direction:column;gap:6px}
.herr button{display:flex;align-items:center;gap:9px;border:1.5px solid var(--linea);background:var(--carta);border-radius:8px;padding:7px 10px;font-weight:600;font-size:13.5px;cursor:pointer;text-align:left}
.herr button.activo{background:var(--negro);border-color:var(--negro);color:#fff}
.herr .ico{width:22px;height:22px;flex:none}
.cancha{background:var(--cesped);border-radius:var(--r);padding:10px;touch-action:none}
.cancha svg{display:block;width:100%;height:auto;max-height:72vh;user-select:none}

/* Partido en vivo */
.reloj{font-family:var(--f-d);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px}
.marcador{display:flex;align-items:center;gap:18px;justify-content:center;font-family:var(--f-d);font-weight:700}
.marcador .eq{font-size:20px;text-transform:uppercase;text-align:center;max-width:180px}
.marcador .gol{font-size:54px;font-variant-numeric:tabular-nums}
.botonera{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.bev{border:1.5px solid var(--linea);background:var(--carta);border-radius:10px;padding:12px 8px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.bev:hover{border-color:var(--tinta)}
.bev .pt{width:12px;height:12px;border-radius:50%}
.bev.gol{background:var(--negro);color:#fff;border-color:var(--negro)}
.en-cancha{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bj{border:1.5px solid var(--linea);background:var(--carta);border-radius:10px;padding:10px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center;text-align:left}
.bj:hover,.bj.sel{border-color:var(--tinta);background:var(--amarillo-t)}
.bj .dorsal{font-size:20px}
.log .fila{font-size:14px}
.min{font-family:var(--f-d);font-weight:700;min-width:38px;color:var(--bronce)}
.graf svg{display:block;width:100%;height:auto}
.graf text{fill:var(--sub);font-size:11px;font-family:var(--f-t)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:8px}
.leyenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Acceso y nube */
body.sin-menu .lateral{display:none}
.acceso{min-height:86vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:30px}
.acc-caja{background:var(--carta);border:1px solid var(--linea);border-radius:14px;padding:24px;width:100%;max-width:400px;justify-self:center}
.acc-form{display:flex;flex-direction:column;gap:12px}
.acc-err{color:var(--rojo);min-height:1.2em;margin:0;font-size:14px;font-weight:600}
.acc-links{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-top:10px}
.acc-marca{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.acc-marca svg{width:52px;height:52px;flex:none}
.acc-marca b{font-family:var(--f-d);font-size:30px;letter-spacing:4px;display:block;line-height:1}
.acc-marca small{font-size:10.5px;letter-spacing:2px;color:var(--sub)}
.codigo-club{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--amarillo-t);border-radius:10px;padding:12px 14px}
/* Tienda */
.pack{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.pack.dest{background:var(--negro);color:#EEEBE3;border-color:var(--negro)}
.pack.dest .sub{color:#B9B3A6}
.precio{font-family:var(--f-d);font-size:40px;font-weight:700;line-height:1}

/* Responsive */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{flex-direction:column}
  .lateral{width:100%;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:10px 0}
  .marca{padding:0 16px 10px;border-bottom:0}
  .club-mini,.pie-lat{display:none}
  nav.menu{flex-direction:row;overflow-x:auto;padding:0 10px 10px;gap:4px}
  nav.menu a{white-space:nowrap;padding:7px 11px}
  nav.menu .sep{display:none}
  main{padding-inline:16px;padding-block:18px 60px}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:minmax(0,1fr)}
  .piz-wrap{grid-template-columns:minmax(0,1fr)}
  .hg,.hg.g2h,.hg.g3h{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  h1{font-size:28px}
  .reloj{font-size:48px}
}
</style>

<div class="app">
  <aside class="lateral">
    <div class="marca">
      <svg viewBox="0 0 80 80" aria-hidden="true"><rect width="80" height="80" rx="16" fill="#FFD400"/><path d="M16 60V20h7l17 23 17-23h7v40h-8V34L40 54 24 34v26z" fill="#141412"/><rect x="14" y="64" width="52" height="3" fill="#141412"/></svg>
      <div><b>METODIKA</b><small>MÉTODO · CANCHA · EQUIPO</small></div>
    </div>
    <div class="club-mini" id="clubMini"></div>
    <nav class="menu" id="menu" aria-label="Secciones"></nav>
    <div class="pie-lat">METODIKA CLUBES · V1</div>
  </aside>
  <main id="vista" tabindex="-1"></main>
</div>
<div id="capaModal"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
"use strict";
/* ================= NÚCLEO ================= */
const CLAVE='metodika_clubes_v1';
const HOY=new Date();HOY.setHours(0,0,0,0);
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const deIso=s=>{const [a,m,d]=s.split('-').map(Number);return new Date(a,m-1,d)};
const sumarDias=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fFecha=s=>{if(!s)return '—';const d=deIso(s);return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()]};
const fCorta=s=>{if(!s)return '—';const d=deIso(s);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')};
const pct=(a,b)=>b?Math.round(a*100/b):0;
const prom=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

const CATEG_TAREA=['Jugadora con pelota','Jugadora sin pelota','Equipo con pelota','Equipo sin pelota'];
const CONT_BASE=['Tenencia','Juego de posición','ABP'];
const REMAP={'Ataque posicional':'Juego de posición','Estructura':'Juego de posición','Pelota parada':'ABP','Ataque directo':'Finalización'};
const remap=c=>REMAP[c]||c;
const unicos=a=>[...new Set(a.filter(Boolean))];
function CONT(){return S.contenidos&&S.contenidos.length?S.contenidos:CONT_BASE}
function contSes(s){return s.contenidos||(s.contenido?[s.contenido]:[])}
function agregarContenido(n){n=(n||'').trim();if(!n)return '';const ex=CONT().find(c=>c.toLowerCase()===n.toLowerCase());if(ex)return ex;S.contenidos=[...CONT(),n];guardar();return n}
function migrar(){
  if(S.contenidos)return;
  S.tareas.forEach(t=>t.contenido=remap(t.contenido));
  S.microciclos.forEach(m=>m.foco=remap(m.foco));
  S.sesiones.forEach(s=>{s.contenidos=unicos(contSes(s).map(remap));delete s.contenido});
  S.contenidos=unicos([...CONT_BASE,...S.tareas.map(t=>t.contenido),...S.microciclos.map(m=>m.foco),...S.sesiones.flatMap(s=>s.contenidos)]);
  guardar();
}
function selCont(id,name,val){return `<select id="${id}" name="${name}" data-cont>${opts(CONT(),val)}<option value="__nuevo">＋ Agregar concepto…</option></select>`}
function conectarCont(root){
  $$('select[data-cont]',root).forEach(sel=>{
    let prev=sel.value;
    sel.onchange=()=>{
      if(sel.value!=='__nuevo'){prev=sel.value;return}
      sel.value=prev;
      if(sel.nextElementSibling&&sel.nextElementSibling.dataset.nuevo)return sel.nextElementSibling.querySelector('input').focus();
      const f=document.createElement('div');f.dataset.nuevo='1';f.style.cssText='display:flex;gap:6px;margin-top:6px';
      f.innerHTML='<input type="text" placeholder="Nuevo concepto, ej.: Transiciones" aria-label="Nuevo concepto"><button type="button" class="btn chico">Agregar</button>';
      sel.after(f);const inp=f.querySelector('input');inp.focus();
      const ok=()=>{const n=agregarContenido(inp.value);if(!n)return;$$('select[data-cont]',root).forEach(s2=>{const v=s2===sel?n:s2.value;s2.innerHTML=opts(CONT(),v)+'<option value="__nuevo">＋ Agregar concepto…</option>';s2.value=v});prev=n;f.remove();aviso('Concepto agregado: '+n)};
      f.querySelector('button').onclick=ok;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok()}};
    };
  });
}

/* Palabras según la rama del club */
function J(tipo){ // tipo: 'pl' jugadoras/es, 'sg' jugadora/or
  const r=S.club.rama;
  if(tipo==='sg')return r==='F'?'jugadora':r==='M'?'jugador':'jugador/a';
  if(tipo==='Pl')return r==='F'?'Jugadoras':r==='M'?'Jugadores':'Jugadoras/es';
  if(tipo==='Sg')return r==='F'?'Jugadora':r==='M'?'Jugador':'Jugador/a';
  return r==='F'?'jugadoras':r==='M'?'jugadores':'jugadoras/es';
}
function catTarea(c){ // adapta "Jugadora con pelota" a la rama
  if(S.club.rama==='M')return c.replace('Jugadora','Jugador');
  if(S.club.rama==='X')return c.replace('Jugadora','Jugador/a');
  return c;
}
function posTxt(p){
  if(!p)return '';
  if(S.club.rama==='F')return p.replace('/o','a').replace('Arquera/o','Arquera');
  if(S.club.rama==='M')return p.replace('Arquera/o','Arquero').replace('Delantera/o','Delantero').replace('Volante interna/o','Volante interno');
  return p;
}

/* ================= CÁLCULOS ================= */
function durSesion(s){return s.tareas.reduce((a,t)=>a+(+t.min||0),0)}
function cargaSesion(s){return durSesion(s)*(+s.rpe||0)}
function proximaSesion(){return [...S.sesiones].filter(s=>deIso(s.fecha)>=HOY).sort((a,b)=>a.fecha.localeCompare(b.fecha))[0]}
function proximoPartido(){return [...S.partidos].filter(p=>p.estado!=='finalizado'&&deIso(p.fecha)>=HOY).sort((a,b)=>a.fecha.localeCompare(b.fecha))[0]}
function asistJugador(id,desde){
  let p=0,t=0,jj=0;
  Object.entries(S.asistencia).forEach(([k,v])=>{
    if(desde){const f=fechaActividad(k);if(!f||deIso(f)<desde)return}
    const r=v.reg[id];if(!r)return;t++;if(r==='P')p++;if(r==='J')jj++;
  });
  return {p,t,jus:jj,pct:pct(p,t)};
}
function fechaActividad(k){const [tp,id]=k.split(':');if(tp==='s'){const s=S.sesiones.find(x=>x.id===id);return s&&s.fecha}const p=S.partidos.find(x=>x.id===id);return p&&p.fecha}
function minutoFinal(p){return p.reloj&&p.reloj.final?p.reloj.final:Math.max(p.duracionTiempo*2,...p.eventos.map(e=>e.min),0)}
function minutosJugados(p,id){
  if(!p.convocados.includes(id))return 0;
  const fin=minutoFinal(p);let entra=p.titulares.includes(id)?0:null,tot=0;
  [...p.eventos].filter(e=>e.tipo==='cambio'||(e.tipo==='tarjeta'&&e.color==='roja')).sort((a,b)=>a.min-b.min).forEach(e=>{
    if(e.tipo==='cambio'){if(e.jug2===id&&entra===null)entra=e.min;if(e.jug===id&&entra!==null){tot+=e.min-entra;entra=null}}
    else if(e.jug===id&&entra!==null){tot+=e.min-entra;entra=null}
  });
  if(entra!==null)tot+=fin-entra;
  return tot;
}
function statsJugador(id){
  const o={pj:0,min:0,gol:0,asis:0,rec:0,per:0,fal:0,ama:0,roj:0,des:0};
  S.partidos.filter(p=>p.estado!=='programado').forEach(p=>{
    const m=minutosJugados(p,id);if(m>0){o.pj++;o.min+=m}
    p.eventos.forEach(e=>{
      if(e.tipo==='gol'&&e.jug===id)o.gol++;
      if(e.tipo==='gol'&&e.jug2===id)o.asis++;
      if(e.jug!==id)return;
      if(e.tipo==='recuperacion')o.rec++;if(e.tipo==='perdida')o.per++;if(e.tipo==='falta')o.fal++;if(e.tipo==='desajuste')o.des++;
      if(e.tipo==='tarjeta'){e.color==='roja'?o.roj++:o.ama++}
    });
  });
  return o;
}
function evalsJugador(id){return S.evaluaciones.filter(e=>e.jugId===id).sort((a,b)=>a.fecha.localeCompare(b.fecha))}
const promEval=e=>prom(DIM_EVAL.map(([c])=>+e[c]));

/* ================= GRÁFICOS (SVG propios) ================= */
function sparkline(vals,{w=160,h=40,min=0,max=10,color='var(--tinta)'}={}){
  if(!vals.length)return '<span class="tenue">Sin datos</span>';
  const n=vals.length,x=i=>n===1?w/2:6+i*(w-12)/(n-1),y=v=>h-5-(v-min)/(max-min)*(h-10);
  const pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Evolución: ${vals.join(', ')}"><line x1="0" y1="${y(5)}" x2="${w}" y2="${y(5)}" stroke="var(--linea)" stroke-dasharray="3 3"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===n-1?4.5:3}" fill="${i===n-1?color:'var(--carta)'}" stroke="${color}" stroke-width="2"><title>${v}</title></circle>`).join('')}</svg>`;
}
function barras(items,{h=150,color='var(--tinta)',unidad=''}={}){ // items [{et,v,tip}]
  if(!items.length)return '<div class="vacio">Sin datos todavía.</div>';
  const W=Math.max(320,items.length*54),max=Math.max(1,...items.map(i=>i.v)),bw=Math.min(34,(W-40)/items.length*.6),paso=(W-40)/items.length;
  const esc2=v=>h-24-(v/max)*(h-44);
  return `<div class="graf" style="overflow-x:auto"><svg viewBox="0 0 ${W} ${h}" style="min-width:${Math.min(W,560)}px" role="img">`+
    `<line x1="30" y1="${h-24}" x2="${W-6}" y2="${h-24}" stroke="var(--linea)"/>`+
    items.map((it,i)=>{const cx=34+paso*i+paso/2,y=esc2(it.v);return `<g><rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${Math.max(0,h-24-y)}" rx="4" fill="${it.color||color}"><title>${esc(it.tip||it.et+': '+it.v+unidad)}</title></rect><text x="${cx}" y="${y-5}" text-anchor="middle" style="fill:var(--tinta);font-weight:600">${it.v}</text><text x="${cx}" y="${h-8}" text-anchor="middle">${esc(it.et)}</text></g>`}).join('')+
    `</svg></div>`;
}

function perfilJugador(el,j){

  const edad=j.nacimiento?Math.floor((HOY-deIso(j.nacimiento))/31557600000):'';
  el.innerHTML=`<button class="btn fantasma chico" id="volver" style="margin-bottom:12px">← Plantel</button>
  <div class="panel" style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
    ${avatar(j,true)}
    <div style="flex:1;min-width:200px"><div class="etq" style="color:var(--bronce)">#${j.dorsal||'–'} · ${esc(posTxt(j.posicion))}</div><h1 style="margin-top:4px">${esc(j.nombre+' '+j.apellido)}</h1>
      <div class="chips" style="margin-top:8px"><span class="chip">${esc(j.categoria||'Sin categoría')}</span>${edad?`<span class="chip">${edad} años</span>`:''}${j.pie?`<span class="chip">Pie ${esc(j.pie.toLowerCase())}</span>`:''}${j.altura?`<span class="chip">${j.altura} cm</span>`:''}</div></div>
    <div style="display:flex;gap:8px"><button class="btn" id="editJ">Editar datos y foto</button></div>
  </div>
  <div class="grilla g4" style="margin-bottom:16px">
    ${[['Partidos',st.pj],['Minutos',st.min],['Goles',st.gol],['Asistencias',st.asis]].map(([t,v])=>`<div class="panel"><div class="etq">${t}</div><div class="dato">${v}</div></div>`).join('')}
  </div>
  <div class="grilla g3" style="margin-bottom:16px">
    <div class="panel"><h3>Asistencia</h3><div class="dato">${a.t?a.pct+'%':'—'}</div><div class="barra" style="margin:10px 0 8px"><i style="width:${a.pct}%"></i></div><div class="sub" style="font-size:13px">${a.p} presentes · ${a.jus} justificadas · ${a.t-a.p-a.jus} ausentes, sobre ${a.t} actividades</div></div>
    <div class="panel"><h3>En partido</h3><div class="lista">
      ${[['Recuperaciones',st.rec],['Pérdidas',st.per],['Faltas',st.fal],['Desajustes',st.des],['Tarjetas',st.ama+' amarillas · '+st.roj+' rojas']].map(([t,v])=>`<div class="fila" style="padding:6px 0"><span>${t}</span><b class="der num">${v}</b></div>`).join('')}</div></div>
    <div class="panel"><div class="panel-cab"><h3>Evaluación</h3><div class="der"><button class="btn chico" id="evalJ">＋ Evaluar</button></div></div>
      ${ult?`<div style="display:flex;align-items:center;gap:12px"><div class="dato">${promEval(ult).toFixed(1)}</div><div class="sub" style="font-size:13px">Promedio al ${fFecha(ult.fecha)}</div></div><div style="margin-top:8px">${sparkline(ev.map(x=>+promEval(x).toFixed(1)),{w:220,h:48})}</div>`:'<div class="vacio">Sin evaluaciones.</div>'}</div>
  </div>
  ${ev.length?`<div class="panel" style="margin-bottom:16px"><h3>Evolución por dimensión</h3><div class="grilla g4" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">${DIM_EVAL.map(([c,t])=>`<div><div class="etq">${t}</div><div style="display:flex;align-items:center;gap:8px"><span class="dato" style="font-size:26px">${ult[c]}</span>${sparkline(ev.map(x=>+x[c]),{w:120,h:36})}</div></div>`).join('')}</div></div>`:''}
  <div class="panel"><h3>Observaciones</h3><p style="margin:0;white-space:pre-wrap" class="${j.obs?'':'tenue'}">${esc(j.obs||'Sin observaciones.')}</p></div>`;
  $('#volver').onclick=()=>ir('plantel');
  $('#editJ').onclick=()=>editarJugador(j);
  $('#evalJ').onclick=()=>editarEvaluacion(null,j.id);
}
function reducirFoto(file,cb){
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),m=240,k=Math.max(img.width,img.height)/m;c.width=Math.round(img.width/Math.max(1,k));c.height=Math.round(img.height/Math.max(1,k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};img.src=fr.result};fr.readAsDataURL(file);
}
function editarJugador(j){
  const n=!j;j=j||{id:uid(),nombre:'',apellido:'',dorsal:'',posicion:POSICIONES[3],categoria:S.club.categoria,nacimiento:'',pie:'Derecho',altura:'',foto:'',obs:''};
  let foto=j.foto;
  modal(n?'Nueva '+J('sg').replace('jugador/a','ficha'):'Editar '+J('sg'),`
  <form class="form" id="fJ">
    <div class="ancho" style="display:flex;gap:14px;align-items:center"><div id="prevF">${avatar(j,true)}</div><label class="btn chico" for="fotoJ">Subir foto</label><input type="file" id="fotoJ" accept="image/*" hidden>${foto?'<button type="button" class="btn chico fantasma" id="sacarF">Quitar foto</button>':''}</div>
    <label class="campo">Nombre<input type="text" id="jn" name="nombre" value="${esc(j.nombre)}" required></label>
    <label class="campo">Apellido<input type="text" id="ja" name="apellido" value="${esc(j.apellido)}" required></label>
    <label class="campo">Dorsal<input type="number" id="jd" name="dorsal" min="1" max="99" value="${esc(j.dorsal)}"></label>
    <label class="campo">Posición<select id="jp" name="posicion">${opts(POSICIONES.map(p=>[p,posTxt(p)]),j.posicion)}</select></label>
    <label class="campo">Categoría<input type="text" id="jc" name="categoria" value="${esc(j.categoria)}" placeholder="Ej.: Primera, Reserva, Sub 16"></label>
    <label class="campo">Fecha de nacimiento<input type="date" id="jf" name="nacimiento" value="${esc(j.nacimiento)}"></label>
    <label class="campo">Pie hábil<select id="jpie" name="pie">${opts(['Derecho','Izquierdo','Ambos'],j.pie)}</select></label>
    <label class="campo">Altura (cm)<input type="number" id="jal" name="altura" value="${esc(j.altura)}"></label>
    <label class="campo ancho">Observaciones<textarea id="jo" name="obs">${esc(j.obs)}</textarea></label>
  </form>
  <div class="modal-pie">${n?'':'<button class="btn peligro" id="borrarJ" style="margin-right:auto">Eliminar</button>'}<button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="guardarJ">Guardar</button></div>`,{alMontar:m=>{
    $('#fotoJ',m).onchange=e=>{const f=e.target.files[0];if(f)reducirFoto(f,d=>{foto=d;$('#prevF',m).innerHTML=avatar({...j,foto:d},true)})};
    const sf=$('#sacarF',m);if(sf)sf.onclick=()=>{foto='';$('#prevF',m).innerHTML=avatar({...j,foto:''},true)};
    $('#guardarJ',m).onclick=()=>{const d=leerForm($('#fJ',m));if(!d.nombre.trim()||!d.apellido.trim()){aviso('Completá nombre y apellido.');return}Object.assign(j,d,{dorsal:d.dorsal?+d.dorsal:'',altura:d.altura?+d.altura:'',foto});if(n)S.jugadores.push(j);guardar();cerrarModal();aviso('Guardado');ruta==='plantel'?ir('plantel',j.id):pintar()};
    const b=$('#borrarJ',m);if(b)b.onclick=()=>confirmar('¿Eliminar a '+j.nombre+'?','Se borra su ficha. Sus eventos en partidos quedan registrados.','Eliminar',()=>{S.jugadores=S.jugadores.filter(x=>x.id!==j.id);guardar();ir('plantel')});
  }});
}

/* ================= PLANIFICACIÓN ================= */
VISTAS.planificacion=el=>{
  const micros=[...S.microciclos].sort((a,b)=>b.inicio.localeCompare(a.inicio));
  const sinMicro=S.sesiones.filter(s=>!S.microciclos.find(m=>m.id===s.microId));
  el.innerHTML=cabecera('Microciclos y sesiones','Planificación','Organizá la semana, armá cada sesión con tareas de la biblioteca y controlá la carga.',`<button class="btn" id="nMicro">＋ Microciclo</button><button class="btn pri" id="nSes">＋ Sesión</button>`)+
  (micros.length||sinMicro.length?micros.map(m=>{
    const ses=S.sesiones.filter(s=>s.microId===m.id).sort((a,b)=>a.fecha.localeCompare(b.fecha));
    const actual=deIso(m.inicio)<=HOY&&HOY<=deIso(m.fin);
    const carga=ses.reduce((a,s)=>a+cargaSesion(s),0);
    return `<div class="panel" style="margin-bottom:16px;${actual?'border-color:var(--tinta);border-width:1.5px':''}">
      <div class="panel-cab"><div><div class="etq" style="color:var(--bronce)">${fCorta(m.inicio)} al ${fCorta(m.fin)}${actual?' · semana actual':''}</div><h3 style="margin-top:3px">${esc(m.nombre)} · ${esc(m.foco)}</h3><div class="sub" style="font-size:14px">${esc(m.objetivo)}</div></div>
        <div class="der"><span class="chip">${ses.length} sesiones</span><span class="chip">Carga ${carga} UA</span><button class="btn chico" data-em="${m.id}">Editar</button><button class="btn chico" data-ns="${m.id}">＋ Sesión</button></div></div>
      ${ses.length?`<div class="grilla g2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)"><div class="lista">${ses.map(s=>`<div class="fila click" data-s="${s.id}"><div style="min-width:78px"><b>${fFecha(s.fecha)}</b><div class="sub" style="font-size:12.5px">${esc(s.hora||'')}</div></div><div style="min-width:0"><b>${esc(s.titulo)}</b><div class="sub" style="font-size:13px">${s.tareas.map(t=>esc((tarea(t.tareaId)||{}).titulo||'Tarea')).join(' · ')}</div></div><div class="der"><span class="chip">${durSesion(s)}′</span></div></div>`).join('')}</div>
        <div>${barras(ses.map(s=>({et:DIAS[deIso(s.fecha).getDay()],v:cargaSesion(s),tip:s.titulo+': '+cargaSesion(s)+' UA (RPE '+s.rpe+' × '+durSesion(s)+' min)'})),{h:140,color:'var(--bronce)',unidad:' UA'})}<div class="sub" style="font-size:12px">Carga = RPE planificado × minutos</div></div></div>`:'<div class="vacio">Este microciclo todavía no tiene sesiones.</div>'}
    </div>`}).join('')+(sinMicro.length?`<div class="panel"><h3>Sesiones sin microciclo</h3><div class="lista">${sinMicro.map(s=>`<div class="fila click" data-s="${s.id}"><b>${fFecha(s.fecha)}</b><span>${esc(s.titulo)}</span></div>`).join('')}</div></div>`:'')
  :`<div class="vacio">Empezá creando un microciclo (una semana de trabajo) y después sumale sesiones.<br><button class="btn pri" style="margin-top:12px" id="nMicro2">＋ Crear microciclo</button></div>`);
  $('#nMicro').onclick=()=>editarMicro();
  const n2=$('#nMicro2');if(n2)n2.onclick=()=>editarMicro();
  $('#nSes').onclick=()=>editarSesion();
  $$('[data-em]',el).forEach(b=>b.onclick=()=>editarMicro(S.microciclos.find(m=>m.id===b.dataset.em)));
  $$('[data-ns]',el).forEach(b=>b.onclick=()=>editarSesion(null,b.dataset.ns));
  $$('[data-s]',el).forEach(b=>b.onclick=()=>verSesion(b.dataset.s));
};
function editarMicro(m){
  const n=!m;const lunes=sumarDias(HOY,-((HOY.getDay()+6)%7));
  m=m||{id:uid(),nombre:'Microciclo '+(S.microciclos.length+1),inicio:iso(lunes),fin:iso(sumarDias(lunes,6)),foco:CONT()[0],objetivo:''};
  modal(n?'Nuevo microciclo':'Editar microciclo',`<form class="form" id="fM">
    <label class="campo ancho">Nombre<input type="text" id="mn" name="nombre" value="${esc(m.nombre)}"></label>
    <label class="campo">Desde<input type="date" id="mi" name="inicio" value="${m.inicio}"></label>
    <label class="campo">Hasta<input type="date" id="mf" name="fin" value="${m.fin}"></label>
    <label class="campo">Foco de la semana${selCont('mfo','foco',m.foco)}</label>
    <label class="campo ancho">Objetivo<textarea id="mo" name="objetivo" placeholder="Ej.: Salir jugando ante presión alta">${esc(m.objetivo)}</textarea></label></form>
    <div class="modal-pie">${n?'':'<button class="btn peligro" id="bM" style="margin-right:auto">Eliminar</button>'}<button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="gM">Guardar</button></div>`,{alMontar:x=>{
    conectarCont(x);
    $('#gM',x).onclick=()=>{Object.assign(m,leerForm($('#fM',x)));if(n)S.microciclos.push(m);guardar();cerrarModal();aviso('Microciclo guardado');pintar()};
    const b=$('#bM',x);if(b)b.onclick=()=>confirmar('¿Eliminar el microciclo?','Las sesiones quedan guardadas, sin microciclo asignado.','Eliminar',()=>{S.microciclos=S.microciclos.filter(z=>z.id!==m.id);guardar();pintar()});
  }});
}
function editarSesion(s,microId){
  const n=!s;
  const mic=microId?S.microciclos.find(m=>m.id===microId):[...S.microciclos].find(m=>deIso(m.inicio)<=HOY&&HOY<=deIso(m.fin));
  if(s)s={...JSON.parse(JSON.stringify(s)),contenidos:contSes(s)};
  s=s||{id:uid(),microId:mic?mic.id:'',fecha:iso(HOY),hora:'18:30',titulo:'',objetivo:mic?mic.objetivo:'',contenidos:mic?[mic.foco]:[],tareas:[],rpe:6,obs:'',jugadores:S.jugadores.map(j=>j.id)};
  const pintarT=m=>{
    $('#listaT',m).innerHTML=s.tareas.length?s.tareas.map((t,i)=>{const ta=tarea(t.tareaId);return `<div class="fila"><span class="min">${i+1}</span><div style="min-width:0;flex:1"><b>${esc(ta?ta.titulo:'Tarea eliminada')}</b><div class="sub" style="font-size:12.5px">${esc(ta?catTarea(ta.categoria)+' · '+ta.tipo:'')}</div></div><input type="number" min="1" value="${t.min}" data-min="${i}" style="width:72px" aria-label="Minutos"><span class="sub">min</span><button type="button" class="btn chico fantasma" data-sube="${i}" aria-label="Subir">↑</button><button type="button" class="btn chico fantasma" data-quita="${i}" aria-label="Quitar">✕</button></div>`}).join(''):'<div class="vacio" style="padding:14px">Sumá tareas desde la biblioteca.</div>';
    $('#totT',m).textContent=durSesion(s)+' min · carga '+(durSesion(s)*s.rpe)+' UA';
    $$('[data-min]',m).forEach(i=>i.oninput=()=>{s.tareas[+i.dataset.min].min=+i.value||0;$('#totT',m).textContent=durSesion(s)+' min · carga '+(durSesion(s)*s.rpe)+' UA'});
    $$('[data-quita]',m).forEach(b=>b.onclick=()=>{s.tareas.splice(+b.dataset.quita,1);pintarT(m)});
    $$('[data-sube]',m).forEach(b=>b.onclick=()=>{const i=+b.dataset.sube;if(i>0){[s.tareas[i-1],s.tareas[i]]=[s.tareas[i],s.tareas[i-1]];pintarT(m)}});
  };
  modal(n?'Nueva sesión':'Editar sesión',`<form class="form" id="fS">
    <label class="campo">Fecha<input type="date" id="sf" name="fecha" value="${s.fecha}"></label>
    <label class="campo">Hora<input type="time" id="sh" name="hora" value="${esc(s.hora)}"></label>
    <label class="campo">Microciclo<select id="sm" name="microId"><option value="">Sin microciclo</option>${opts(S.microciclos.map(m=>[m.id,m.nombre+' ('+fCorta(m.inicio)+')']),s.microId)}</select></label>
    <div class="ancho"><div class="etq" style="margin-bottom:6px">Contenidos de la sesión <span class="tenue" style="text-transform:none;letter-spacing:0;font-weight:500">· podés marcar varios</span></div><div class="chips" id="chCont">${CONT().map(c=>`<label class="chip" style="cursor:pointer"><input type="checkbox" name="contenidos" data-lista="1" value="${esc(c)}" ${s.contenidos.includes(c)?'checked':''}> ${esc(c)}</label>`).join('')}</div>
      <div style="display:flex;gap:6px;margin-top:8px;max-width:380px"><input type="text" id="nuevoCont" placeholder="Otro concepto, ej.: Presión tras pérdida" aria-label="Nuevo concepto"><button type="button" class="btn chico" id="addCont">＋ Agregar</button></div></div>
    <label class="campo ancho">Título<input type="text" id="st" name="titulo" value="${esc(s.titulo)}" placeholder="Ej.: MD-3 · Salida de juego"></label>
    <label class="campo ancho">Objetivo<textarea id="so" name="objetivo" style="min-height:56px">${esc(s.objetivo)}</textarea></label>
    <div class="ancho"><div class="panel-cab" style="margin-bottom:6px"><b>Tareas</b><span class="sub" id="totT" style="margin-left:auto"></span><button type="button" class="btn chico" id="addT">＋ Agregar tarea</button></div><div class="lista" id="listaT"></div></div>
    <label class="campo">RPE planificado (1 a 10)<input type="number" id="sr" name="rpe" min="1" max="10" value="${s.rpe}"></label>
    <label class="campo">${J('Pl')} ${S.club.rama==='F'?'citadas':S.club.rama==='M'?'citados':'citadas/os'}<select id="sj" name="jsel"><option value="todas">Todo el plantel (${S.jugadores.length})</option><option value="elegir" ${s.jugadores.length!==S.jugadores.length?'selected':''}>Elegir…</option></select></label>
    <div class="ancho" id="elegirJ" ${s.jugadores.length===S.jugadores.length?'hidden':''}><div class="chips">${ordenJ(S.jugadores).map(j=>`<label class="chip" style="cursor:pointer"><input type="checkbox" name="jugadores" data-lista="1" value="${j.id}" ${s.jugadores.includes(j.id)?'checked':''}> ${esc(j.nombre[0]+'. '+j.apellido)}</label>`).join('')}</div></div>
    <label class="campo ancho">Observaciones<textarea id="sob" name="obs" style="min-height:56px">${esc(s.obs)}</textarea></label>
  </form><div class="modal-pie">${n?'':'<button class="btn peligro" id="bS" style="margin-right:auto">Eliminar</button>'}<button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="gS">Guardar sesión</button></div>`,{ancho:true,alMontar:m=>{
    pintarT(m);
    const addC=()=>{const n=agregarContenido($('#nuevoCont',m).value);if(!n)return;const ya=$(`#chCont input[value="${CSS.escape(n)}"]`,m);if(ya)ya.checked=true;else $('#chCont',m).insertAdjacentHTML('beforeend',`<label class="chip" style="cursor:pointer"><input type="checkbox" name="contenidos" data-lista="1" value="${esc(n)}" checked> ${esc(n)}</label>`);$('#nuevoCont',m).value='';aviso('Concepto agregado: '+n)};
    $('#addCont',m).onclick=addC;$('#nuevoCont',m).onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addC()}};
    $('#sr',m).oninput=e=>{s.rpe=+e.target.value||0;pintarT(m)};
    $('#sj',m).onchange=e=>{$('#elegirJ',m).hidden=e.target.value!=='elegir'};
    $('#addT',m).onclick=()=>elegirTareas(ids=>{ids.forEach(id=>{const t=tarea(id);s.tareas.push({tareaId:id,min:t.duracion||10})});pintarT(m)},m);
    $('#gS',m).onclick=()=>{const d=leerForm($('#fS',m));const js=d.jsel==='todas'?S.jugadores.map(j=>j.id):(d.jugadores||[]);delete d.jsel;delete d.jugadores;
      Object.assign(s,d,{rpe:+d.rpe||0,jugadores:js,contenidos:d.contenidos||[]});delete s.contenido;if(!s.titulo.trim())s.titulo=(s.contenidos.join(' + ')||'Sesión');
      const i=S.sesiones.findIndex(x=>x.id===s.id);if(i>=0)S.sesiones[i]=s;else S.sesiones.push(s);guardar();cerrarModal();aviso('Sesión guardada');pintar()};
    const b=$('#bS',m);if(b)b.onclick=()=>confirmar('¿Eliminar la sesión?','También se borra su registro de asistencia.','Eliminar',()=>{S.sesiones=S.sesiones.filter(x=>x.id!==s.id);delete S.asistencia['s:'+s.id];guardar();pintar()});
  }});
}
// Selector de tareas en una capa encima del modal de sesión
function elegirTareas(cb,modalPadre){
  const capa=document.createElement('div');capa.className='velo';capa.style.zIndex=55;
  capa.innerHTML=`<div class="modal"><div class="modal-cab"><h2>Elegir tareas</h2><button class="btn fantasma chico x" data-c aria-label="Cerrar">✕</button></div><input type="search" id="bT" placeholder="Buscar por nombre, contenido o tipo" style="margin-bottom:10px"><div class="lista" id="rT" style="max-height:52vh;overflow-y:auto"></div><div class="modal-pie"><button class="btn" data-c>Cancelar</button><button class="btn pri" id="okT">Agregar seleccionadas</button></div></div>`;
  document.body.appendChild(capa);
  const sel=new Set();
  const pin=()=>{const q=$('#bT',capa).value.toLowerCase();$('#rT',capa).innerHTML=S.tareas.filter(t=>(t.titulo+t.contenido+t.tipo+t.categoria).toLowerCase().includes(q)).map(t=>`<label class="fila click" style="cursor:pointer"><input type="checkbox" value="${t.id}" ${sel.has(t.id)?'checked':''}><div style="min-width:0"><b>${esc(t.titulo)}</b><div class="sub" style="font-size:12.5px">${esc(catTarea(t.categoria))} · ${esc(t.tipo)} · ${t.duracion} min</div></div></label>`).join('')||'<div class="vacio">No hay tareas con esa búsqueda.</div>';
    $$('#rT input',capa).forEach(i=>i.onchange=()=>i.checked?sel.add(i.value):sel.delete(i.value))};
  pin();$('#bT',capa).oninput=pin;$('#bT',capa).focus();
  const cerrar=()=>capa.remove();
  $$('[data-c]',capa).forEach(b=>b.onclick=cerrar);
  $('#okT',capa).onclick=()=>{cb([...sel]);cerrar()};
}
function verSesion(id){
  const s=S.sesiones.find(x=>x.id===id);if(!s)return;
  const m=S.microciclos.find(x=>x.id===s.microId);

function radio(f){const [w,h]=FORMATOS[f]||[40,30];return Math.max(.55,Math.min(1.7,Math.max(w,h)*.02))}

  pz.elementos=(pz.elementos||[]).map(e=>{const o={...e,id:e.id||uid()};if(mapa[e.t]){o.color=mapa[e.t];o.t='J'}if(!o.color&&MATERIALES[o.t])o.color=MATERIALES[o.t].c;return o});

function lineasCancha(f,k){

// curva cuadrática: (cx,cy) es el punto medio SOBRE la curva
function ctrl(a){const mx=(a.x1+a.x2)/2,my=(a.y1+a.y2)/2;const hx=a.cx??mx,hy=a.cy??my;return [2*hx-mx,2*hy-my]}

function dentroZona(z,x,y){if(z.forma==='circ'){const rx=z.w/2,ry=z.h/2;return ((x-z.x-rx)/rx)**2+((y-z.y-ry)/ry)**2<=1}return x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h}

      case 'P':return `<circle cx="${x}" cy="${y}" r="${r*.5}" fill="#fff" stroke="#141412" stroke-width="${r*.1}"/><circle cx="${x}" cy="${y}" r="${r*.18}" fill="#141412"/>`;
      case 'O':return `<path d="M${x} ${y-r*.75}L${x+r*.6} ${y+r*.5}H${x-r*.6}Z" fill="${c}" stroke="rgba(0,0,0,.5)" stroke-width="${r*.08}"/>`;
      case 'D':return `<ellipse cx="${x}" cy="${y}" rx="${r*.55}" ry="${r*.32}" fill="${c}" stroke="rgba(0,0,0,.45)" stroke-width="${r*.07}"/><ellipse cx="${x}" cy="${y-r*.04}" rx="${r*.18}" ry="${r*.1}" fill="rgba(0,0,0,.25)"/>`;
      case 'R':return `<circle cx="${x}" cy="${y}" r="${r*1.05}" fill="none" stroke="${c}" stroke-width="${r*.2}"/>`;
      case 'V':return `<g${rot}><rect x="${x-r*1.1}" y="${y-r*.14}" width="${r*2.2}" height="${r*.28}" rx="${r*.06}" fill="${c}" stroke="rgba(0,0,0,.5)" stroke-width="${r*.06}"/><rect x="${x-r*1.1}" y="${y-r*.4}" width="${r*.16}" height="${r*.8}" fill="${c}"/><rect x="${x+r*.94}" y="${y-r*.4}" width="${r*.16}" height="${r*.8}" fill="${c}"/></g>`;
      case 'H':return `<path d="M${x-r*.55} ${y-r*.7}L${x-r*.2} ${y-r*.7}L${x} ${y-r*.35}L${x+r*.2} ${y-r*.7}L${x+r*.55} ${y-r*.7}L${x+r*.6} ${y+r*.7}L${x-r*.6} ${y+r*.7}Z" fill="${c}" stroke="rgba(0,0,0,.5)" stroke-width="${r*.07}" stroke-linejoin="round"/>`;
      case 'E':{let s=`<g${rot}><rect x="${x-r*2.6}" y="${y-r*.6}" width="${r*5.2}" height="${r*1.2}" fill="none" stroke="${c}" stroke-width="${r*.12}"/>`;for(let i=1;i<6;i++)s+=`<line x1="${x-r*2.6+i*r*5.2/6}" y1="${y-r*.6}" x2="${x-r*2.6+i*r*5.2/6}" y2="${y+r*.6}" stroke="${c}" stroke-width="${r*.12}"/>`;return s+'</g>'}
      case 'N':return `<g${rot}><rect x="${x-r*1.4}" y="${y-r*.35}" width="${r*2.8}" height="${r*.7}" fill="rgba(255,255,255,.15)" stroke="${c}" stroke-width="${r*.2}"/></g>`;
      case 'G':return `<g${rot}><rect x="${x-3.66*k}" y="${y-r*.45}" width="${7.32*k}" height="${r*.9}" fill="rgba(255,255,255,.18)" stroke="${c}" stroke-width="${r*.22}"/></g>`;
    }return ''};
  const txt=t=>`<text x="${t.x*k}" y="${t.y*k}" text-anchor="middle" font-family="Barlow,Arial" font-weight="700" font-size="${r*(t.tam||1)}" fill="#fff" stroke="rgba(0,0,0,.6)" stroke-width="${r*.2}" paint-order="stroke">${esc(t.txt)}</text>`;
  // resaltado de la selección y manijas
  let hl='';
  if(sel&&!mini){const hs=r*.55,man=(x,y,col='#FFD400')=>`<rect x="${x*k-hs/2}" y="${y*k-hs/2}" width="${hs}" height="${hs}" fill="${col}" stroke="#141412" stroke-width="${r*.08}"/>`;
    if(sel.tipo==='el'){const e=pz.elementos.find(x=>x.id===sel.id);if(e){const [x,y]=pos(e);hl=`<circle cx="${x*k}" cy="${y*k}" r="${r*1.55}" fill="none" stroke="#FFD400" stroke-width="${r*.12}" stroke-dasharray="${r*.35} ${r*.25}"/>`}}
    if(sel.tipo==='zo'){const z=pz.zonas.find(x=>x.id===sel.id);if(z)hl=`<rect x="${z.x*k}" y="${z.y*k}" width="${z.w*k}" height="${z.h*k}" fill="none" stroke="#FFD400" stroke-width="${r*.08}"/>`+man(z.x+z.w,z.y+z.h)}
    if(sel.tipo==='fl'){const a=pz.flechas.find(x=>x.id===sel.id);if(a){const [mx,my]=puntoCurva(a,.5);hl=man(a.x1,a.y1,'#fff')+man(a.x2,a.y2,'#fff')+`<circle cx="${mx*k}" cy="${my*k}" r="${hs*.62}" fill="#FFD400" stroke="#141412" stroke-width="${r*.08}"/>`}}
    if(sel.tipo==='tx'){const t=pz.textos.find(x=>x.id===sel.id);if(t){const w=t.txt.length*r*(t.tam||1)*.3;hl=`<rect x="${t.x*k-w-r*.3}" y="${t.y*k-r*(t.tam||1)}" width="${w*2+r*.6}" height="${r*(t.tam||1)*1.3}" fill="none" stroke="#FFD400" stroke-width="${r*.08}" stroke-dasharray="${r*.3} ${r*.2}"/>`}}
  }
  const flechasV=pz.flechas.filter(a=>(a.fr||0)===frame);
  return `<svg viewBox="${-pad} ${-pad} ${W*k+pad*2} ${H*k+pad*2}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama ${esc(pz.nombre||'')}"><defs>${mk}</defs>
    <rect x="${-pad}" y="${-pad}" width="${W*k+pad*2}" height="${H*k+pad*2}" fill="#2F6B45"/>${fr.join('')}${lineasCancha(pz.formato,k)}
    ${pz.zonas.map(zon).join('')}${flechasV.map(fle).join('')}${previa?fle(previa):''}${pz.elementos.filter(e=>e.t!=='J'&&e.t!=='P').map(el).join('')}${pz.elementos.filter(e=>e.t==='J').map(el).join('')}${pz.elementos.filter(e=>e.t==='P').map(el).join('')}${pz.textos.map(txt).join('')}${hl}</svg>`;
}

function borrarSel(){if(!SEL)return;snap();const f={el:'elementos',zo:'zonas',fl:'flechas',tx:'textos'}[SEL.tipo];PZ[f]=PZ[f].filter(x=>x.id!==SEL.id);if(SEL.tipo==='el')PZ.pasos.forEach(p=>delete p.pos[SEL.id]);SEL=null;redibujar();pintarSel()}

function conectarCancha(){
  const svg=$('#cancha svg');if(!svg)return;
  const k=10,r=radio(PZ.formato);
  const pto=ev=>{const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());const [W,H]=FORMATOS[PZ.formato];return {x:Math.max(-1,Math.min(W+1,q.x/k)),y:Math.max(-1,Math.min(H+1,q.y/k))}};
  const repintar=(o={})=>{svg.innerHTML=new DOMParser().parseFromString(svgPizarra(PZ,{frame:FR,sel:SEL,...o}),'image/svg+xml').documentElement.innerHTML};
  let drag=null;
  const hits=p=>{
    const d=(x,y)=>Math.hypot(x-p.x,y-p.y);
    if(SEL){ // manijas de la selección
      if(SEL.tipo==='zo'){const z=PZ.zonas.find(x=>x.id===SEL.id);if(z&&d(z.x+z.w,z.y+z.h)<r*1.1)return {t:'zoRes',o:z}}
      if(SEL.tipo==='fl'){const a=PZ.flechas.find(x=>x.id===SEL.id);if(a){const [mx,my]=puntoCurva(a,.5);if(d(mx,my)<r*1.1)return {t:'flMid',o:a};if(d(a.x1,a.y1)<r)return {t:'flA',o:a};if(d(a.x2,a.y2)<r)return {t:'flB',o:a}}}
    }
    let best=null,bd=1e9;PZ.elementos.forEach(e=>{const [x,y]=posEn(PZ,e,FR);const dd=d(x,y);const lim=e.t==='E'?r*2.6:e.t==='G'?3.7:r*1.5;if(dd<lim&&dd<bd){bd=dd;best=e}});if(best)return {t:'el',o:best};
    for(const t of [...PZ.textos].reverse()){const w=t.txt.length*r*(t.tam||1)*.32+r*.4;if(Math.abs(p.x-t.x)<w&&p.y<t.y+r*.3&&p.y>t.y-r*(t.tam||1))return {t:'tx',o:t}}
    for(const a of PZ.flechas.filter(a=>(a.fr||0)===FR)){for(let i=0;i<=20;i++){const [x,y]=puntoCurva(a,i/20);if(d(x,y)<r*.8)return {t:'fl',o:a}}}
    for(const z of [...PZ.zonas].reverse())if(dentroZona(z,p.x,p.y))return {t:'zo',o:z};
    return null;
  };
  svg.onpointerdown=ev=>{
    if(animando)return;
    ev.preventDefault();const p=pto(ev);svg.setPointerCapture(ev.pointerId);
    if(herr==='mover'){
      const h=hits(p);
      if(!h){if(SEL){SEL=null;repintar();pintarSel()}return}
      snap();
      if(h.t==='zoRes'){drag={t:'zoRes',o:h.o};return}
      if(h.t==='flMid'||h.t==='flA'||h.t==='flB'){drag={t:h.t,o:h.o};return}
      const tipo={el:'el',tx:'tx',fl:'fl',zo:'zo'}[h.t];SEL={tipo,id:h.o.id};
      if(h.t==='el'){const [x,y]=posEn(PZ,h.o,FR);drag={t:'el',o:h.o,dx:x-p.x,dy:y-p.y}}
      else if(h.t==='tx')drag={t:'tx',o:h.o,dx:h.o.x-p.x,dy:h.o.y-p.y};
      else if(h.t==='zo')drag={t:'zo',o:h.o,dx:h.o.x-p.x,dy:h.o.y-p.y};
      else if(h.t==='fl')drag={t:'fl',o:h.o,px:p.x,py:p.y,a:{...h.o}};
      repintar();pintarSel();return;
    }
    if(herr==='borrar'){const h=hits(p);if(h&&['el','tx','fl','zo'].includes(h.t)){SEL={tipo:h.t,id:h.o.id};borrarSel()}return}
    if(FLECHAS[herr]){drag={t:'nfl',x1:p.x,y1:p.y};return}
    if(['rect','cuad','circ'].includes(herr)){drag={t:'nz',x:p.x,y:p.y};return}
    if(herr==='texto'){modal('Texto en la cancha',`<label class="campo">Qué querés escribir<input type="text" id="nuevoTx" placeholder="Ej.: Zona de presión"></label><div class="modal-pie"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="okTx">Agregar</button></div>`,{alMontar:m=>{const ok=()=>{const v=$('#nuevoTx',m).value.trim();cerrarModal();if(!v)return;snap();const t={id:uid(),x:p.x,y:p.y,txt:v,tam:1};PZ.textos.push(t);SEL={tipo:'tx',id:t.id};herr='mover';pintar()};$('#okTx',m).onclick=ok;$('#nuevoTx',m).onkeydown=e=>{if(e.key==='Enter')ok()}}});return}
    snap();const e={id:uid(),t:herr,x:p.x,y:p.y};
    if(herr==='J'){e.color=colorJ;e.n=PZ.elementos.filter(x=>x.t==='J'&&x.color===colorJ).length+1}
    else if(MATERIALES[herr])e.color=MATERIALES[herr].c;
    PZ.elementos.push(e);redibujar();
  };
  svg.onpointermove=ev=>{
    if(!drag)return;const p=pto(ev);
    if(drag.t==='el')setPos(drag.o,p.x+drag.dx,p.y+drag.dy);
    else if(drag.t==='tx'||drag.t==='zo'){drag.o.x=p.x+drag.dx;drag.o.y=p.y+drag.dy}
    else if(drag.t==='zoRes'){const z=drag.o;z.w=Math.max(1,p.x-z.x);z.h=Math.max(1,p.y-z.y);if(z.forma==='cuad')z.h=z.w}
    else if(drag.t==='flMid'){drag.o.cx=p.x;drag.o.cy=p.y}
    else if(drag.t==='flA'){drag.o.x1=p.x;drag.o.y1=p.y}
    else if(drag.t==='flB'){drag.o.x2=p.x;drag.o.y2=p.y}
    else if(drag.t==='fl'){const dx=p.x-drag.px,dy=p.y-drag.py,a=drag.a;Object.assign(drag.o,{x1:a.x1+dx,y1:a.y1+dy,x2:a.x2+dx,y2:a.y2+dy});if(a.cx!=null){drag.o.cx=a.cx+dx;drag.o.cy=a.cy+dy}}
    else if(drag.t==='nfl')return repintar({previa:{x1:drag.x1,y1:drag.y1,x2:p.x,y2:p.y,k:herr}});
    else if(drag.t==='nz'){let w=Math.abs(p.x-drag.x),h=Math.abs(p.y-drag.y);if(herr==='cuad')h=w=Math.max(w,h);const tmp={...PZ,zonas:[...PZ.zonas,{id:'tmp',forma:herr==='circ'?'circ':'rect',color:colorZ,x:Math.min(drag.x,p.x),y:Math.min(drag.y,p.y),w,h}],_v:2};svg.innerHTML=new DOMParser().parseFromString(svgPizarra(tmp,{frame:FR}),'image/svg+xml').documentElement.innerHTML;return}
    repintar();
  };
  svg.onpointerup=ev=>{
    if(!drag)return;const p=pto(ev),d=drag;drag=null;
    if(d.t==='nfl'&&Math.hypot(p.x-d.x1,p.y-d.y1)>r){snap();const a={id:uid(),x1:d.x1,y1:d.y1,x2:p.x,y2:p.y,k:herr,fr:FR};PZ.flechas.push(a)}
    if(d.t==='nz'){let w=Math.abs(p.x-d.x),h=Math.abs(p.y-d.y);if(herr==='cuad')h=w=Math.max(w,h);if(w>r&&h>r){snap();const z={id:uid(),forma:herr==='circ'?'circ':herr==='cuad'?'cuad':'rect',color:colorZ,x:Math.min(d.x,p.x),y:Math.min(d.y,p.y),w,h};PZ.zonas.push(z)}}
    redibujar();pintarSel();
  };
}

function pararAnim(repintarTodo){if(animando){cancelAnimationFrame(animando);animando=null;if(repintarTodo)pintar()}}
function reproducir(){
  const N=PZ.pasos.length;if(!N)return;SEL=null;pintarSel();
  const btn=$('#frPlay');if(btn)btn.textContent='■ Detener';
  const dur=1100,pausa=350,t0=performance.now();
  const paso=now=>{
    const t=now-t0,seg=Math.floor(t/(dur+pausa));
    if(seg>=N){animando=null;FR=N;pintar();return}
    const f=Math.min(1,(t-seg*(dur+pausa))/dur),e=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2,over={};
    PZ.elementos.forEach(el=>{const a=posEn(PZ,el,seg),b=posEn(PZ,el,seg+1);over[el.id]=[a[0]+(b[0]-a[0])*e,a[1]+(b[1]-a[1])*e]});
    const c=$('#cancha');if(!c){animando=null;return}
    c.innerHTML=svgPizarra(PZ,{frame:seg,over});
    const lbl=$('.pasos b');if(lbl)lbl.textContent='Paso '+(seg+1)+' → '+(seg+2)+' de '+(N+1);
    animando=requestAnimationFrame(paso);
  };
  animando=requestAnimationFrame(paso);
}

function analisisPartido(el,p){

  const fin=minutoFinal(p),cuenta=t=>p.eventos.filter(e=>e.tipo===t).length;
  const rec=cuenta('recuperacion'),per=cuenta('perdida'),bal=rec-per;
  const tramos=[];for(let a=0;a<Math.max(90,fin);a+=15)tramos.push([a,a+15]);
  const enT=(t,[a,b])=>p.eventos.filter(e=>e.tipo===t&&e.min>a&&e.min<=b).length;
  // gráfico espejado: recuperaciones arriba, pérdidas abajo
  const W=640,H=220,mid=H/2,maxV=Math.max(1,...tramos.map(tr=>Math.max(enT('recuperacion',tr),enT('perdida',tr)))),sc=(mid-26)/maxV,pw=(W-50)/tramos.length,bw=Math.min(40,pw*.55);

  // línea de tiempo de hitos
  const hit=p.eventos.filter(e=>['gol','golRival','tarjeta','cambio'].includes(e.tipo)).sort((a,b)=>a.min-b.min);
  const TW=640,x=m=>20+(TW-40)*Math.min(m,fin)/fin;

  const lineaT=`<div class="graf" style="overflow-x:auto"><svg viewBox="0 0 ${TW} 92" style="min-width:520px" role="img" aria-label="Línea de tiempo del partido"><line x1="20" y1="46" x2="${TW-20}" y2="46" stroke="var(--linea)" stroke-width="3" stroke-linecap="round"/><line x1="${x(p.duracionTiempo)}" y1="34" x2="${x(p.duracionTiempo)}" y2="58" stroke="var(--tenue)" stroke-dasharray="3 3"/><text x="${x(p.duracionTiempo)}" y="74" text-anchor="middle">ET</text>${[0,15,30,45,60,75,90].filter(m=>m<=fin).map(m=>`<text x="${x(m)}" y="88" text-anchor="middle">${m}′</text>`).join('')}${hit.map((e,i)=>`<g transform="translate(${x(e.min)},${e.tipo==='golRival'||e.tipo==='cambio'?60:32})"><title>${e.min}′ ${NOMBRE_EV[e.tipo]}${e.jug?' · '+cortoJ(e.jug):''}${e.jug2&&e.tipo==='cambio'?' → '+cortoJ(e.jug2):''}</title>${icoH(e)}</g>`).join('')}</svg></div><div class="leyenda"><span>● Gol propio (arriba)</span><span>○ Gol rival (abajo)</span><span>▮ Tarjeta</span><span>⇄ Cambio</span></div>`;
  const filas=ordenJ(p.convocados.map(jugador).filter(Boolean)).map(j=>{const c=t=>p.eventos.filter(e=>e.tipo===t&&e.jug===j.id).length;return {j,min:minutosJugados(p,j.id),gol:c('gol'),asis:p.eventos.filter(e=>e.tipo==='gol'&&e.jug2===j.id).length,rec:c('recuperacion'),per:c('perdida'),fal:c('falta'),des:c('desajuste'),tar:p.eventos.filter(e=>e.tipo==='tarjeta'&&e.jug===j.id).map(e=>e.color==='roja'?'🟥':'🟨').join('')}}).filter(f=>f.min>0||f.rec||f.per);
  const maxRec=Math.max(1,...filas.map(f=>f.rec));
  const obs=p.eventos.filter(e=>e.tipo==='obs');
  el.innerHTML=`<div class="grilla g4" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr));margin-bottom:16px">

  <div class="grilla g2" style="margin-bottom:16px"><div class="panel"><h3>Recuperaciones y pérdidas cada 15′</h3>${grafT}</div><div class="panel"><h3>Momentos del partido</h3>${lineaT}

function cortarSubs(){subs.forEach(u=>{try{u()}catch(e){}});subs=[]}
function abrirClub(clubId,recienCreado){
  cortarSubs();CLUB=clubId;MODO='nube';
  pantallaCompleta(`${marcaGrande()}<p class="sub">Cargando los datos del club…</p>`);
  const ref=db.collection('clubes').doc(clubId);
  let listos={club:false,datos:false,partidos:false,pizarras:false,fotos:false};
  if(!recienCreado)S={version:1,demo:false,contenidos:[...CONT_BASE],club:{nombre:'',categoria:'',temporada:String(HOY.getFullYear()),rama:'F',escudo:'',duracionTiempo:45},jugadores:[],tareas:[],pizarras:[],microciclos:[],sesiones:[],partidos:[],asistencia:{},evaluaciones:[]};
  const listo=k=>{if(listos[k])return;listos[k]=true;if(Object.values(listos).every(Boolean)){document.body.classList.remove('sin-menu');migrarNube();{const h=(location.hash||'').replace('#','');if(VISTAS[h])ruta=h}pintar();estadoNube('guardado')}};
  subs.push(ref.onSnapshot(d=>{
    if(!d.exists){cortarSubs();pantallaClub('El club ya no existe.');return}
    CLUBDOC=d.data();
    if(!CLUBDOC.miembros||!CLUBDOC.miembros[USR.uid]){cortarSubs();db.collection('usuarios').doc(USR.uid).set({clubId:firebase.firestore.FieldValue.delete()},{merge:true});pantallaClub('Ya no formás parte de ese club.');return}
    if(esAdmin()&&!subs.solic){subs.solic=true;subs.push(ref.collection('solicitudes').onSnapshot(qs=>{SOLIC=qs.docs.map(x=>({uid:x.id,...x.data()}));pintarMenu();if(ruta==='ajustes'&&!$('#capaModal').innerHTML)pintar()},()=>{}))}
    if(listos.club)repintarRemoto();listo('club');
  },e=>{cortarSubs();pantallaClub(errTxt(e))}));
  subs.push(ref.collection('datos').onSnapshot(qs=>{
    let cambio=false;
    qs.docChanges().forEach(ch=>{const k=ch.doc.id;if(!COL_DOC.includes(k))return;const s=ch.doc.data().v;if(s===ultimo[k])return;
      if(listos.datos&&localSinSubir(k))return; // hay cambios propios sin subir: gana el último que guarda
      ultimo[k]=s;let v=JSON.parse(s);if(k==='jugadores')v=v.map(j=>({...j,foto:FOTOS[j.id]||''}));S[k]=v;cambio=true});
    if(!listos.datos&&qs.empty){if(!recienCreado){S=clubVacio();S.club.nombre=(CLUBDOC&&CLUBDOC.nombre)||'Mi club';if(CLUBDOC&&CLUBDOC.categoria)S.club.categoria=CLUBDOC.categoria;if(CLUBDOC&&CLUBDOC.rama)S.club.rama=CLUBDOC.rama}subirTodo()}
    if(cambio&&listos.datos)repintarRemoto();listo('datos');
  },e=>{pantallaCompleta(marcaGrande()+'<p class="acc-err">No se pudieron cargar los datos: '+esc(errTxt(e))+'</p><button class="btn" onclick="location.reload()">Reintentar</button>')}));
  COL_ITEMS.forEach(k=>subs.push(ref.collection(k).onSnapshot(qs=>{
    let cambio=false;
    qs.docChanges().forEach(ch=>{const id=ch.doc.id;if(ch.type==='removed'){if(ultimoItems[k][id]!==undefined){delete ultimoItems[k][id];S[k]=S[k].filter(x=>x.id!==id);cambio=true}return}
      const s=ch.doc.data().v;if(s===ultimoItems[k][id])return;const loc=S[k].find(x=>x.id===id);if(listos[k]&&loc&&JSON.stringify(loc)!==ultimoItems[k][id])return;
      ultimoItems[k][id]=s;const v=JSON.parse(s);if(k==='pizarras')normalizar(v);const i=S[k].findIndex(x=>x.id===id);if(i>=0)S[k][i]=v;else S[k].push(v);cambio=true});
    if(cambio&&listos[k])repintarRemoto();listo(k);
  },e=>aviso(errTxt(e)))));
  subs.push(ref.collection('fotos').onSnapshot(qs=>{
    qs.docChanges().forEach(ch=>{const id=ch.doc.id;if(ch.type==='removed'){delete FOTOS[id];delete ultimoFoto[id]}else{FOTOS[id]=ch.doc.data().d||'';ultimoFoto[id]=FOTOS[id]}const j=S.jugadores.find(x=>x.id===id);if(j)j.foto=FOTOS[id]||''});
    if(listos.fotos)repintarRemoto();listo('fotos');
  },e=>{pantallaCompleta(marcaGrande()+'<p class="acc-err">No se pudieron cargar los datos: '+esc(errTxt(e))+'</p><button class="btn" onclick="location.reload()">Reintentar</button>')}));
}

function valorDoc(k){let v=S[k];if(k==='jugadores')v=v.map(j=>({...j,foto:''}));return JSON.stringify(v??null)}
function localSinSubir(k){return tSync&&valorDoc(k)!==ultimo[k]}

  const ref=db.collection('clubes').doc(CLUB),ops=[],ts=firebase.firestore.FieldValue.serverTimestamp();
  COL_DOC.forEach(k=>{const s=valorDoc(k);if(s!==ultimo[k]){ultimo[k]=s;ops.push(b=>b.set(ref.collection('datos').doc(k),{v:s,t:ts,por:USR.uid}))}});
  COL_ITEMS.forEach(k=>{const vivos=new Set();S[k].forEach(it=>{vivos.add(it.id);const s=JSON.stringify(it);if(s!==ultimoItems[k][it.id]){ultimoItems[k][it.id]=s;ops.push(b=>b.set(ref.collection(k).doc(it.id),{v:s,t:ts,por:USR.uid}))}});
    Object.keys(ultimoItems[k]).forEach(id=>{if(!vivos.has(id)){delete ultimoItems[k][id];ops.push(b=>b.delete(ref.collection(k).doc(id)))}})});
  const ids=new Set(S.jugadores.map(j=>j.id));
  S.jugadores.forEach(j=>{const f=j.foto||'';if(f!==(ultimoFoto[j.id]||'')){ultimoFoto[j.id]=f;FOTOS[j.id]=f;ops.push(b=>f?b.set(ref.collection('fotos').doc(j.id),{d:f}):b.delete(ref.collection('fotos').doc(j.id)))}});
  Object.keys(ultimoFoto).forEach(id=>{if(!ids.has(id)){delete ultimoFoto[id];delete FOTOS[id];ops.push(b=>b.delete(ref.collection('fotos').doc(id)))}});
  if(!ops.length){estadoNube('guardado');return}
  try{for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}estadoNube(navigator.onLine===false?'offline':'guardado')}
  catch(e){estadoNube('error');aviso('No se pudo guardar en la nube: '+errTxt(e));ultimo={};Object.keys(ultimoItems).forEach(k=>ultimoItems[k]={})}
}
