<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141412">
</head>
<body>
<title>Metodika Clubes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --suelo:#EDEAE2; --carta:#FAF8F3; --carta2:#F3F0E8; --tinta:#17160F; --sub:#6A6558; --tenue:#9C968A;
  --linea:#DCD7CA; --negro:#141412; --negro2:#1F1E1B; --amarillo:#FFD400; --amarillo-t:#FFF3B0;
  --bronce:#94652B; --verde:#2E6B4A; --verde-t:#E1EEE5; --rojo:#B3452F; --rojo-t:#F6E2DC; --ambar:#B67C0E; --ambar-t:#F7EACB;
  --cesped:#2F6B45; --cesped2:#2A613F; --raya:rgba(255,255,255,.85);
  --f-d:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --f-t:'Barlow','Segoe UI',Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --suelo:#121210; --carta:#1B1A17; --carta2:#23221E; --tinta:#EEEBE3; --sub:#A7A194; --tenue:#7A756A;
    --linea:#2F2D28; --negro:#0A0A09; --negro2:#161614; --amarillo-t:#3A3413;
    --bronce:#CF9A5C; --verde:#63AE83; --verde-t:#1D2C23; --rojo:#E48A72; --rojo-t:#3A211B; --ambar:#E0AA45; --ambar-t:#352A14;
    --cesped:#24533A; --cesped2:#204B34;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --suelo:#121210; --carta:#1B1A17; --carta2:#23221E; --tinta:#EEEBE3; --sub:#A7A194; --tenue:#7A756A;
  --linea:#2F2D28; --negro:#0A0A09; --negro2:#161614; --amarillo-t:#3A3413;
  --bronce:#CF9A5C; --verde:#63AE83; --verde-t:#1D2C23; --rojo:#E48A72; --rojo-t:#3A211B; --ambar:#E0AA45; --ambar-t:#352A14;
  --cesped:#24533A; --cesped2:#204B34;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--suelo);color:var(--tinta);font-family:var(--f-t);font-size:15px;line-height:1.45;margin:0}
h1,h2,h3,h4{font-family:var(--f-d);font-weight:700;letter-spacing:.2px;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:34px;text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:19px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}
.num,td.n,.tab{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Estructura ---------- */
.app{display:flex;min-height:100%}
.lateral{width:232px;flex:none;background:var(--negro);color:#EDEAE2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-block:20px 16px}
.marca{display:flex;gap:12px;align-items:center;padding:0 20px 20px;border-bottom:1px solid #2A2925}
.marca svg{width:38px;height:38px;flex:none}
.marca b{font-family:var(--f-d);font-size:22px;letter-spacing:3px;display:block;line-height:1}
.marca small{font-size:9.5px;letter-spacing:1.3px;white-space:nowrap;color:#A7A194;display:block;margin-top:4px}
.club-mini{padding:14px 20px;font-size:13px;color:#C9C4B8;border-bottom:1px solid #2A2925;display:flex;gap:10px;align-items:center}
.club-mini .esc{width:30px;height:30px;border-radius:50%;background:#2A2925;display:grid;place-items:center;overflow:hidden;flex:none;font-family:var(--f-d);font-weight:700;color:var(--amarillo)}
.club-mini .esc img{width:100%;height:100%;object-fit:cover}
.club-mini b{display:block;color:#fff;font-weight:600;line-height:1.2}
nav.menu{display:flex;flex-direction:column;gap:2px;padding:12px 10px;overflow-y:auto;flex:1}
nav.menu a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;text-decoration:none;color:#CFCABE;font-weight:500;font-size:14.5px}
nav.menu a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.menu a:hover{background:#1F1E1B;color:#fff}
nav.menu a.activo{background:var(--amarillo);color:#141412;font-weight:600}
nav.menu .sep{height:1px;background:#2A2925;margin:8px 6px}
.pie-lat{padding:10px 20px 0;font-size:11px;color:#7A756A;letter-spacing:1.5px}
main{flex:1;min-width:0;padding-block:26px 60px;padding-inline:32px}
.analisis-frame{display:block;width:100%;height:calc(100vh - 190px);min-height:620px;border:1px solid var(--linea);border-radius:var(--r);background:var(--suelo)}
.demo-banda{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--amarillo);color:#141412;border-radius:var(--r);padding:10px 16px;margin-bottom:22px;font-weight:500}
.demo-banda b{font-family:var(--f-d);letter-spacing:1px;text-transform:uppercase}
.demo-banda .btn{margin-left:auto;background:#141412;color:#fff;border-color:#141412}
.cab{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.cab .eyebrow{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;color:var(--bronce);font-weight:600;margin-bottom:6px}
.cab .acc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.cab p{margin:6px 0 0;color:var(--sub);max-width:62ch}

/* ---------- Piezas ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--linea);background:var(--carta);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--tinta)}
.btn.pri{background:var(--negro);border-color:var(--negro);color:#fff}
.btn.pri:hover{background:#000}
:root[data-theme="dark"] .btn.pri{background:var(--amarillo);border-color:var(--amarillo);color:#141412}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{background:var(--amarillo);border-color:var(--amarillo);color:#141412}}
.btn.ama{background:var(--amarillo);border-color:var(--amarillo);color:#141412}
.btn.peligro{color:var(--rojo);border-color:var(--rojo-t)}
.btn.chico{padding:5px 10px;font-size:13px}
.btn.fantasma{background:transparent;border-color:transparent}
.btn.fantasma:hover{border-color:var(--linea)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:18px}
.panel > h3{margin-bottom:12px}
.panel-cab{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel-cab h3{margin:0}
.panel-cab .der{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;max-width:100%}
.grilla{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.etq{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--sub);font-weight:600}
.dato{font-family:var(--f-d);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.sub{color:var(--sub)}
.tenue{color:var(--tenue)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--carta2);border:1px solid var(--linea);white-space:nowrap}
.chip.ok{background:var(--verde-t);color:var(--verde);border-color:transparent}
.chip.mal{background:var(--rojo-t);color:var(--rojo);border-color:transparent}
.chip.aviso{background:var(--ambar-t);color:var(--ambar);border-color:transparent}
.chip.ama{background:var(--amarillo);color:#141412;border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.vacio{padding:26px;text-align:center;color:var(--sub);border:1.5px dashed var(--linea);border-radius:var(--r)}
.lista{display:flex;flex-direction:column}
.fila{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:0}
.fila .der{margin-left:auto;display:flex;gap:6px;align-items:center}
.fila.click{cursor:pointer}
.fila.click:hover{background:var(--carta2)}
.av{width:38px;height:38px;border-radius:50%;background:var(--negro);color:var(--amarillo);display:grid;place-items:center;font-family:var(--f-d);font-weight:700;font-size:15px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.g{width:84px;height:84px;font-size:30px}
.dorsal{font-family:var(--f-d);font-weight:700;font-size:15px;min-width:24px;color:var(--bronce)}
.tabla-c{overflow-x:auto;border:1px solid var(--linea);border-radius:var(--r);background:var(--carta)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--sub);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--linea);white-space:nowrap;background:var(--carta2)}
td{padding:9px 12px;border-bottom:1px solid var(--linea);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--carta2)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filtros select,.filtros input{min-width:0}
label.campo{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--sub)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],input[type=url],input[type=search],select,textarea{background:var(--carta);border:1.5px solid var(--linea);border-radius:8px;padding:8px 10px;font-size:14.5px;color:var(--tinta);width:100%}
textarea{min-height:78px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--tinta);outline:none}
.form{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .ancho{grid-column:1/-1}
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--linea);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabs button.activo{color:var(--tinta);border-bottom-color:var(--amarillo)}
.seg{display:inline-flex;border:1.5px solid var(--linea);border-radius:8px;overflow-x:auto;max-width:100%}
.seg button{flex:none}
.seg button{border:0;background:var(--carta);padding:6px 11px;font-weight:600;font-size:13px;cursor:pointer;color:var(--sub)}
.seg button+button{border-left:1.5px solid var(--linea)}
.seg button.activo{background:var(--negro);color:#fff}
.barra{height:8px;background:var(--carta2);border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--verde);border-radius:99px}

/* Modal */
.velo{position:fixed;inset:0;background:rgba(10,10,9,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--carta);border-radius:14px;width:100%;max-width:640px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.ancho{max-width:900px}
.modal-cab{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-cab h2{font-size:22px}
.modal-cab .x{margin-left:auto}
.modal-pie{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.aviso-t{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--negro);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* Tarjetas de jugadora */
.cartas-j{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.cj{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left}
.cj:hover{border-color:var(--tinta)}
.cj b{display:block;line-height:1.2}
.cj small{color:var(--sub)}

/* Tareas */
.cartas-t{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ct{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.ct:hover{border-color:var(--tinta)}
.ct .mini{background:var(--cesped);aspect-ratio:16/10;max-width:100%}
.ct .mini svg{display:block;width:100%;height:100%}
.ct .cuerpo{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.ct h3{font-size:18px}

/* Pizarra */
.piz-wrap{display:grid;grid-template-columns:236px minmax(0,1fr);gap:16px;align-items:start}
.herr .etq{margin-top:8px}
.hg{display:grid;grid-template-columns:1fr;gap:5px}
.hg.g2h{grid-template-columns:1fr 1fr}
.hg.g3h{grid-template-columns:repeat(3,minmax(0,1fr))}
.hg.g2h button,.hg.g3h button{flex-direction:column;gap:3px;font-size:11.5px;padding:7px 3px;text-align:center;justify-content:center}
.herr button span{min-width:0;overflow-wrap:anywhere}
.colores{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--linea);cursor:pointer;padding:0;flex:none}
.sw.activo{outline:3px solid var(--tinta);outline-offset:2px}
.pasos{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.fila-sel{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.herr{display:flex;flex-direction:column;gap:6px}
.herr button{display:flex;align-items:center;gap:9px;border:1.5px solid var(--linea);background:var(--carta);border-radius:8px;padding:7px 10px;font-weight:600;font-size:13.5px;cursor:pointer;text-align:left}
.herr button.activo{background:var(--negro);border-color:var(--negro);color:#fff}
.herr .ico{width:22px;height:22px;flex:none}
.cancha{background:var(--cesped);border-radius:var(--r);padding:10px;touch-action:none}
.cancha svg{display:block;width:100%;height:auto;max-height:72vh;user-select:none}
@media(max-width:700px){.cfg-cancha{grid-template-columns:1fr!important}}

/* Partido en vivo */
.reloj{font-family:var(--f-d);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px}
.marcador{display:flex;align-items:center;gap:18px;justify-content:center;font-family:var(--f-d);font-weight:700}
.marcador .eq{font-size:20px;text-transform:uppercase;text-align:center;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:6px}
.marcador .gol{font-size:54px;font-variant-numeric:tabular-nums}
.botonera{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.bev{border:1.5px solid var(--linea);background:var(--carta);border-radius:10px;padding:12px 8px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.bev:hover{border-color:var(--tinta)}
.bev .pt{width:12px;height:12px;border-radius:50%}
.bev.gol{background:var(--negro);color:#fff;border-color:var(--negro)}
.en-cancha{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bj{border:1.5px solid var(--linea);background:var(--carta);border-radius:10px;padding:10px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center;text-align:left}
.bj:hover,.bj.sel{border-color:var(--tinta);background:var(--amarillo-t)}
.bj .dorsal{font-size:20px}
.log .fila{font-size:14px}
.min{font-family:var(--f-d);font-weight:700;min-width:38px;color:var(--bronce)}
.graf svg{display:block;width:100%;height:auto}
.graf text{fill:var(--sub);font-size:11px;font-family:var(--f-t)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:8px}
.leyenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Acceso y nube */
body.sin-menu .lateral{display:none}
.acceso{min-height:86vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:30px}
.acc-caja{background:var(--carta);border:1px solid var(--linea);border-radius:14px;padding:24px;width:100%;max-width:400px;justify-self:center}
.acc-form{display:flex;flex-direction:column;gap:12px}
.acc-err{color:var(--rojo);min-height:1.2em;margin:0;font-size:14px;font-weight:600}
.acc-links{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-top:10px}
.acc-marca{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.acc-marca svg{width:52px;height:52px;flex:none}
.acc-marca b{font-family:var(--f-d);font-size:30px;letter-spacing:4px;display:block;line-height:1}
.acc-marca small{font-size:10.5px;letter-spacing:2px;color:var(--sub)}
.codigo-club{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--amarillo-t);border-radius:10px;padding:12px 14px}
/* Tienda */
.pack{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.pack.dest{background:var(--negro);color:#EEEBE3;border-color:var(--negro)}
.pack.dest .sub{color:#B9B3A6}
.precio{font-family:var(--f-d);font-size:40px;font-weight:700;line-height:1}

/* Responsive */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{flex-direction:column}
  .lateral{width:100%;height:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:10px 0}
  .marca{padding:0 16px 10px;border-bottom:0}
  .club-mini,.pie-lat{display:none}
  nav.menu{flex-direction:row;overflow-x:auto;padding:0 10px 10px;gap:4px}
  nav.menu a{white-space:nowrap;padding:7px 11px}
  nav.menu .sep{display:none}
  main{padding-inline:16px;padding-block:18px 60px}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:minmax(0,1fr)}
  .piz-wrap{grid-template-columns:minmax(0,1fr)}
  /* Pizarra en celular y tablet vertical: herramientas en una tira deslizable arriba de la cancha */
  .herr{flex-direction:row;overflow-x:auto;gap:6px;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .herr .etq{display:none}
  .herr .hg,.herr .hg.g2h,.herr .hg.g3h{display:flex;gap:6px}
  .herr button,.hg.g2h button,.hg.g3h button{flex-direction:column;gap:3px;min-width:68px;max-width:78px;padding:7px 4px;font-size:10.5px;line-height:1.15;text-align:center;justify-content:center;flex:none}
  .herr .colores{flex-wrap:nowrap;align-items:center;margin:0 4px}
  .herr .sw{width:30px;height:30px}
  .cancha{padding:4px}
  .cancha svg{max-height:62vh}
  .cartas-pz{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))!important}
  .ayuda-tira{display:block!important}
  h1{font-size:28px}
  .reloj{font-size:48px}
}
/* ===== Panel de rendimiento (Inicio) ===== */
.rend-filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.rend-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px;align-items:start}
.rend-bal{font-family:var(--f-d);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.rend-bal .v{color:var(--verde)}.rend-bal .e{color:var(--ambar)}.rend-bal .d{color:var(--rojo)}
.rend-barra{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--carta2);margin:10px 0 6px}
.rend-barra span{display:block;height:100%}
.rend-ult{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rend-ult .it{display:flex;align-items:center;gap:7px;border:1px solid var(--linea);border-radius:99px;padding:4px 10px 4px 5px;font-size:13px;background:var(--carta)}

<script>
"use strict";
/* ================= NÚCLEO ================= */
const CLAVE='metodika_clubes_v1';
const HOY=new Date();HOY.setHours(0,0,0,0);
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const escRaw=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const esc=s=>escRaw(G(s));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const deIso=s=>{const [a,m,d]=s.split('-').map(Number);return new Date(a,m-1,d)};
const sumarDias=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fFecha=s=>{if(!s)return '—';const d=deIso(s);return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()]};
const fCorta=s=>{if(!s)return '—';const d=deIso(s);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')};
const pct=(a,b)=>b?Math.round(a*100/b):0;
const prom=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const iniciales=j=>((j.nombre||'?')[0]+(j.apellido||'')[0]||'').toUpperCase();

const CATEG_TAREA=['Tenencia','Organización ofensiva','Organización defensiva','Transición ataque–defensa','Transición defensa–ataque','Pelota parada ofensiva','Pelota parada defensiva','Técnica individual','Físico-condicional / entrada en calor'];
const CATEG_VIEJAS=['Jugadora con pelota','Jugadora sin pelota','Equipo con pelota','Equipo sin pelota'];
function CATEG(){return [...CATEG_TAREA,...((typeof S!=='undefined'&&S&&S.club&&S.club.categoriasExtra)||[]).filter(c=>!CATEG_TAREA.includes(c))]}
function catNueva(t){const c=t.categoria,co=t.contenido||'',ti=t.tipo||'';if(!CATEG_VIEJAS.includes(c))return c;
  if(/^Jugadora/.test(c))return 'Técnica individual';
  if(c==='Equipo con pelota'){if(co==='ABP'||ti==='Pelota parada')return 'Pelota parada ofensiva';if(co==='Transiciones')return 'Transición defensa–ataque';if(co==='Tenencia'||ti==='Rondo')return 'Tenencia';return 'Organización ofensiva'}
  if(co==='ABP'||ti==='Pelota parada')return 'Pelota parada defensiva';if(co==='Transiciones')return 'Transición ataque–defensa';return 'Organización defensiva'}
function migrarCategorias(){if(!S||!S.tareas)return;let n=0;S.tareas.forEach(t=>{const c=catNueva(t);if(c!==t.categoria){t.categoria=c;n++}});if(n)guardar()}
const CONT_BASE=['Tenencia','Juego de posición','ABP'];
const REMAP={'Ataque posicional':'Juego de posición','Estructura':'Juego de posición','Pelota parada':'ABP','Ataque directo':'Finalización'};
const remap=c=>REMAP[c]||c;
const unicos=a=>[...new Set(a.filter(Boolean))];
function CONT(){return S.contenidos&&S.contenidos.length?S.contenidos:CONT_BASE}
function contSes(s){return s.contenidos||(s.contenido?[s.contenido]:[])}
function agregarContenido(n){n=(n||'').trim();if(!n)return '';const ex=CONT().find(c=>c.toLowerCase()===n.toLowerCase());if(ex)return ex;S.contenidos=[...CONT(),n];guardar();return n}
function migrar(){
  if(S.contenidos)return;
  S.tareas.forEach(t=>t.contenido=remap(t.contenido));
  S.microciclos.forEach(m=>m.foco=remap(m.foco));
  S.sesiones.forEach(s=>{s.contenidos=unicos(contSes(s).map(remap));delete s.contenido});
  S.contenidos=unicos([...CONT_BASE,...S.tareas.map(t=>t.contenido),...S.microciclos.map(m=>m.foco),...S.sesiones.flatMap(s=>s.contenidos)]);
  guardar();
}
function selCont(id,name,val){return `<select id="${id}" name="${name}" data-cont>${opts(CONT(),val)}<option value="__nuevo">＋ Agregar concepto…</option></select>`}
function conectarCont(root){
  $$('select[data-cont]',root).forEach(sel=>{
    let prev=sel.value;
    sel.onchange=()=>{
      if(sel.value!=='__nuevo'){prev=sel.value;return}
      sel.value=prev;
      if(sel.nextElementSibling&&sel.nextElementSibling.dataset.nuevo)return sel.nextElementSibling.querySelector('input').focus();
      const f=document.createElement('div');f.dataset.nuevo='1';f.style.cssText='display:flex;gap:6px;margin-top:6px';
      f.innerHTML='<input type="text" placeholder="Nuevo concepto, ej.: Transiciones" aria-label="Nuevo concepto"><button type="button" class="btn chico">Agregar</button>';
      sel.after(f);const inp=f.querySelector('input');inp.focus();
      const ok=()=>{const n=agregarContenido(inp.value);if(!n)return;$$('select[data-cont]',root).forEach(s2=>{const v=s2===sel?n:s2.value;s2.innerHTML=opts(CONT(),v)+'<option value="__nuevo">＋ Agregar concepto…</option>';s2.value=v});prev=n;f.remove();aviso('Concepto agregado: '+n)};
      f.querySelector('button').onclick=ok;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok()}};
    };
  });
}
const TIPOS_TAREA=['Rondo','Juego de posición','Juego reducido','Oleadas','Partido condicionado','Técnica analítica','Finalización','Pelota parada','Físico integrado'];

let S=null;
function guardar(){if(typeof MODO!=='undefined'){if(MODO==='nube'){programarSync();return}if(MODO==='demo')return}try{localStorage.setItem(CLAVE,JSON.stringify(S))}catch(e){}}
function cargar(){try{const t=localStorage.getItem(CLAVE);if(t)return JSON.parse(t)}catch(e){}return null}

/* Palabras según la rama del club */
function J(tipo){ // tipo: 'pl' jugadoras/es, 'sg' jugadora/or
  const r=S.club.rama;
  if(tipo==='sg')return r==='F'?'jugadora':r==='M'?'jugador':'jugador/a';
  if(tipo==='Pl')return r==='F'?'Jugadoras':r==='M'?'Jugadores':'Jugadoras/es';
  if(tipo==='Sg')return r==='F'?'Jugadora':r==='M'?'Jugador':'Jugador/a';
  return r==='F'?'jugadoras':r==='M'?'jugadores':'jugadoras/es';
}
function catTarea(c){ // adapta "Jugadora con pelota" a la rama
  if(S.club.rama==='M')return c.replace('Jugadora','Jugador');
  if(S.club.rama==='X')return c.replace('Jugadora','Jugador/a');
  return c;
}
function posTxt(p){
  if(!p)return '';
  if(S.club.rama==='F')return p.replace('/o','');
  if(S.club.rama==='M')return p.replace('Arquera/o','Arquero').replace('Delantera/o','Delantero').replace('Volante interna/o','Volante interno');
  return p;
}

/* Muestra un texto de la biblioteca base según la rama del club */
function G(s,rama){const r=rama||(typeof S!=='undefined'&&S&&S.club?S.club.rama:'X');return String(s??'').replace(/\[([^|\]]*)\|([^\]]*)\]/g,(m,f,ma)=>r==='F'?f:r==='M'?ma:f+'/'+ma)}
/* Clubes existentes: pasa las 12 tareas base a textos para ambas ramas y suma las nuevas (una sola vez) */
function migrarTareasBase(){
  if(!S||!S.club||(S.club.tareasBase||1)>=BASE_VERSION)return false;
  const B=baseTareas();
  const viejas=B.tareas.slice(0,12),nuevas=B.tareas.slice(12);
  const campos=['titulo','objetivo','descripcion','consignas'];
  viejas.forEach(b=>{const t=S.tareas.find(x=>!x.base&&x.titulo===G(b.titulo,'F'));if(!t)return;
    campos.forEach(c=>{if(t[c]===G(b[c],'F'))t[c]=b[c]});t.base=b.base;
    if(!t.diagrama&&b.diagrama){const p=B.pz.find(z=>z.id===b.diagrama);if(p){S.pizarras.push(normalizar(JSON.parse(JSON.stringify(p))));t.diagrama=p.id}}});
  nuevas.forEach(b=>{if(S.tareas.some(x=>x.base===b.base||G(x.titulo,'F')===G(b.titulo,'F')))return;
    const p=B.pz.find(z=>z.id===b.diagrama);if(p){const c=normalizar(JSON.parse(JSON.stringify(p)));S.pizarras.push(c)}S.tareas.push(b)});
  S.contenidos=unicos([...CONT(),...nuevas.map(t=>t.contenido)]);
  S.club.tareasBase=BASE_VERSION;
  return true;
}

function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
function crearDemo(){
  const R=rnd(20260923);
  const pick=a=>a[Math.floor(R()*a.length)];
  const nombres=[['Valentina','Ríos'],['Camila','Ferreyra'],['Martina','Sosa'],['Lucía','Aguirre'],['Sofía','Benítez'],['Julieta','Molina'],['Agustina','Paz'],['Milagros','Correa'],['Florencia','Luna'],['Rocío','Ledesma'],['Abril','Quiroga'],['Brenda','Ojeda'],['Candela','Vera'],['Daiana','Medina'],['Emilia','Carrizo'],['Guadalupe','Peralta'],['Jazmín','Toledo'],['Micaela','Godoy'],['Nahiara','Bustos'],['Paula','Villalba'],['Pilar','Arias'],['Zoe','Maldonado']];
  const pos=['Arquera/o','Arquera/o','Defensa central','Defensa central','Defensa central','Lateral','Lateral','Lateral','Lateral','Volante central','Volante central','Volante central','Volante interna/o','Volante interna/o','Volante interna/o','Extremo','Extremo','Extremo','Extremo','Delantera/o','Delantera/o','Delantera/o'];
  const jug=nombres.map((n,i)=>({id:'j'+(i+1),nombre:n[0],apellido:n[1],dorsal:i===1?12:(i<1?1:i+1),posicion:pos[i],categoria:i<16?'Primera':'Reserva',nacimiento:iso(new Date(1998+Math.floor(R()*9),Math.floor(R()*12),1+Math.floor(R()*27))),pie:R()<.25?'Izquierdo':'Derecho',altura:155+Math.floor(R()*20),foto:'',obs:''}));

  const {pz,tareas}=baseTareas();
  // microciclos y sesiones: 3 semanas pasadas, la actual y la próxima
  const lunesHoy=sumarDias(HOY,-((HOY.getDay()+6)%7));
  const micros=[],sesiones=[];
  const focosSem=['Tenencia','Juego de posición','Transiciones','Juego de posición','Finalización'];
  for(let w=-3;w<=1;w++){
    const ini=sumarDias(lunesHoy,w*7);
    const m={id:uid(),nombre:'Microciclo '+(w+4),inicio:iso(ini),fin:iso(sumarDias(ini,6)),foco:focosSem[w+3],objetivo:['Asegurar la posesión en campo propio','Salir jugando ante presión alta','Reaccionar rápido tras la pérdida','Generar ventajas por fuera','Llegar al área en velocidad'][w+3]};
    micros.push(m);
    [[0,'MD-4',6],[1,'MD-3',7],[3,'MD-2',5],[4,'MD-1',3]].forEach(([d,rot,rpe],k)=>{
      const f=sumarDias(ini,d);
      const pool=tareas.filter(t=>t.contenido===m.foco||R()<.35);
      const el=[];while(el.length<3){const t=pick(pool.length?pool:tareas);if(!el.find(x=>x.tareaId===t.id))el.push({tareaId:t.id,min:t.duracion})}
      sesiones.push({id:uid(),microId:m.id,fecha:iso(f),hora:'18:30',titulo:rot+' · '+m.foco,objetivo:m.objetivo,contenidos:unicos([m.foco,...el.map(x=>tareas.find(t=>t.id===x.tareaId).contenido)]),tareas:el,rpe,obs:'',jugadores:jug.map(j=>j.id)});
    });
  }
  // partidos
  const rivales=['Deportivo Sierras','Unión del Sur','Atlético Ferroviario','Club Villa Nueva','Sportivo Alameda','Racing de las Lomas','Juventud Unida','Estudiantes del Parque'];
  const partidos=[];
  for(let k=0;k<8;k++){
    const f=sumarDias(lunesHoy,(k-4)*7+5);
    partidos.push({id:uid(),competicion:k===2?'Copa Provincial':'Torneo Apertura',fecha:iso(f),hora:k%2?'15:00':'11:00',rival:rivales[k],condicion:k%2?'Visitante':'Local',golesF:null,golesC:null,estado:'programado',convocados:[],titulares:[],eventos:[],reloj:{tiempo:1,corriendo:false,acum:0,inicio:0},duracionTiempo:45,obs:''});
  }
  // simular los partidos jugados
  partidos.filter(p=>deIso(p.fecha)<HOY).forEach(p=>{
    const conv=jug.filter(j=>j.categoria==='Primera'||R()<.3).slice(0,18);
    p.convocados=conv.map(j=>j.id);
    const arq=conv.find(j=>j.posicion==='Arquera/o');
    const campo=conv.filter(j=>j!==arq);
    p.titulares=[arq.id,...campo.slice(0,10).map(j=>j.id)];
    const sup=campo.slice(10);
    const ev=[];let enC=[...p.titulares];
    const tipos=['recuperacion','recuperacion','recuperacion','perdida','perdida','perdida','falta','desajuste'];
    for(let m=1;m<=90;m++){
      if(R()<.62){const t=pick(tipos);ev.push({id:uid(),min:m,tipo:t,jug:pick(enC.slice(1))})}
      if(R()<.018){const g=pick(enC.slice(4));const a=R()<.6?pick(enC.slice(2).filter(x=>x!==g)):'';ev.push({id:uid(),min:m,tipo:'gol',jug:g,jug2:a})}
      if(R()<.012)ev.push({id:uid(),min:m,tipo:'golRival'});
      if(R()<.02)ev.push({id:uid(),min:m,tipo:'tarjeta',color:R()<.9?'amarilla':'roja',jug:pick(enC.slice(1))});
      if([60,70,78].includes(m)&&sup.length){const e=sup.shift();const s=enC[1+Math.floor(R()*10)];enC=enC.map(x=>x===s?e:x);ev.push({id:uid(),min:m,tipo:'cambio',jug:s,jug2:e})}
    }
    p.eventos=ev;p.estado='finalizado';p.reloj={tiempo:2,corriendo:false,acum:45*60000,inicio:0,final:90};
    p.golesF=ev.filter(e=>e.tipo==='gol').length;p.golesC=ev.filter(e=>e.tipo==='golRival').length;
  });
  // convocatoria del próximo partido
  const prox=partidos.find(p=>deIso(p.fecha)>=HOY);
  if(prox){prox.convocados=jug.filter(j=>j.categoria==='Primera').map(j=>j.id).concat(['j17','j18']);prox.titulares=[]}
  // asistencia
  const asistencia={};
  sesiones.filter(s=>deIso(s.fecha)<HOY).forEach(s=>{const reg={};jug.forEach(j=>{const r=R();reg[j.id]=r<.84?'P':r<.93?'J':'A'});asistencia['s:'+s.id]={reg,obs:{}}});
  partidos.filter(p=>p.estado==='finalizado').forEach(p=>{const reg={};p.convocados.forEach(id=>reg[id]='P');asistencia['p:'+p.id]={reg,obs:{}}});
  // evaluaciones: tres cortes
  const evaluaciones=[];
  [-70,-40,-10].forEach((d,k)=>{jug.forEach(j=>{const base=5+R()*2.5;const e={id:uid(),fecha:iso(sumarDias(HOY,d)),jugId:j.id,obs:''};DIM_EVAL.forEach(([c])=>e[c]=Math.max(1,Math.min(10,Math.round(base+k*.5+(R()-.4)*2))));evaluaciones.push(e)})});

  return {version:1,demo:true,contenidos:['Tenencia','Juego de posición','ABP','Transiciones','Finalización','Defensa en bloque'],club:{nombre:'Club Atlético Los Aromos',categoria:'Primera Femenina',temporada:'2026',rama:'F',escudo:'',duracionTiempo:45,tareasBase:BASE_VERSION},
    jugadores:jug,tareas,pizarras:pz,microciclos:micros,sesiones,partidos,asistencia,evaluaciones};
}

    jugadores:[],tareas:base,pizarras:B.pz.map(normalizar),microciclos:[],sesiones:[],partidos:[],asistencia:{},evaluaciones:[]};

function durSesion(s){return s.tareas.reduce((a,t)=>a+(+t.min||0),0)}
function cargaSesion(s){return durSesion(s)*(+s.rpe||0)}
function proximaSesion(){return [...S.sesiones].filter(s=>deIso(s.fecha)>=HOY).sort((a,b)=>a.fecha.localeCompare(b.fecha))[0]}
function proximoPartido(){return [...S.partidos].filter(p=>p.estado!=='finalizado'&&deIso(p.fecha)>=HOY).sort((a,b)=>a.fecha.localeCompare(b.fecha))[0]}
function asistJugador(id,desde){
  let p=0,t=0,jj=0;
  Object.entries(S.asistencia).forEach(([k,v])=>{
    if(desde){const f=fechaActividad(k);if(!f||deIso(f)<desde)return}
    const r=v.reg[id];if(!r)return;t++;if(r==='P')p++;if(r==='J')jj++;
  });
  return {p,t,jus:jj,pct:pct(p,t)};
}
function fechaActividad(k){const [tp,id]=k.split(':');if(tp==='s'){const s=S.sesiones.find(x=>x.id===id);return s&&s.fecha}const p=S.partidos.find(x=>x.id===id);return p&&p.fecha}
function minutoFinal(p){return p.reloj&&p.reloj.final?p.reloj.final:Math.max(p.duracionTiempo*2,...p.eventos.map(e=>e.min),0)}
function minutosJugados(p,id){
  if(!p.convocados.includes(id))return 0;
  const fin=minutoFinal(p);let entra=p.titulares.includes(id)?0:null,tot=0;
  [...p.eventos].filter(e=>e.tipo==='cambio'||(e.tipo==='tarjeta'&&e.color==='roja')).sort((a,b)=>a.min-b.min).forEach(e=>{
    if(e.tipo==='cambio'){if(e.jug2===id&&entra===null)entra=e.min;if(e.jug===id&&entra!==null){tot+=e.min-entra;entra=null}}
    else if(e.jug===id&&entra!==null){tot+=e.min-entra;entra=null}
  });
  if(entra!==null)tot+=fin-entra;
  return tot;
}
function statsJugador(id){
  const o={pj:0,min:0,gol:0,asis:0,rec:0,per:0,fal:0,ama:0,roj:0,des:0};
  S.partidos.filter(p=>p.estado!=='programado').forEach(p=>{
    const m=minutosJugados(p,id);if(m>0){o.pj++;o.min+=m}
    p.eventos.forEach(e=>{
      if(e.tipo==='gol'&&e.jug===id)o.gol++;
      if(e.tipo==='gol'&&e.jug2===id)o.asis++;
      if(e.jug!==id)return;
      if(e.tipo==='recuperacion')o.rec++;if(e.tipo==='perdida')o.per++;if(e.tipo==='falta')o.fal++;if(e.tipo==='desajuste')o.des++;
      if(e.tipo==='tarjeta'){e.color==='roja'?o.roj++:o.ama++}
    });
  });
  return o;
}

function sparkline(vals,{w=160,h=40,min=0,max=10,color='var(--tinta)'}={}){
  if(!vals.length)return '<span class="tenue">Sin datos</span>';
  const n=vals.length,x=i=>n===1?w/2:6+i*(w-12)/(n-1),y=v=>h-5-(v-min)/(max-min)*(h-10);
  const pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Evolución: ${vals.join(', ')}"><line x1="0" y1="${y(5)}" x2="${w}" y2="${y(5)}" stroke="var(--linea)" stroke-dasharray="3 3"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===n-1?4.5:3}" fill="${i===n-1?color:'var(--carta)'}" stroke="${color}" stroke-width="2"><title>${v}</title></circle>`).join('')}</svg>`;
}
function barras(items,{h=150,color='var(--tinta)',unidad=''}={}){ // items [{et,v,tip}]
  if(!items.length)return '<div class="vacio">Sin datos todavía.</div>';
  const W=Math.max(320,items.length*54),max=Math.max(1,...items.map(i=>i.v)),bw=Math.min(34,(W-40)/items.length*.6),paso=(W-40)/items.length;
  const esc2=v=>h-24-(v/max)*(h-44);
  return `<div class="graf" style="overflow-x:auto"><svg viewBox="0 0 ${W} ${h}" style="min-width:${Math.min(W,560)}px" role="img">`+
    `<line x1="30" y1="${h-24}" x2="${W-6}" y2="${h-24}" stroke="var(--linea)"/>`+
    items.map((it,i)=>{const cx=34+paso*i+paso/2,y=esc2(it.v);return `<g><rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${Math.max(0,h-24-y)}" rx="4" fill="${it.color||color}"><title>${esc(it.tip||it.et+': '+it.v+unidad)}</title></rect><text x="${cx}" y="${y-5}" text-anchor="middle" style="fill:var(--tinta);font-weight:600">${it.v}</text><text x="${cx}" y="${h-8}" text-anchor="middle">${esc(it.et)}</text></g>`}).join('')+
    `</svg></div>`;
}

}

function reducirFoto(file,cb){
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),m=240,k=Math.max(img.width,img.height)/m;c.width=Math.round(img.width/Math.max(1,k));c.height=Math.round(img.height/Math.max(1,k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};img.src=fr.result};fr.readAsDataURL(file);
}

    let y=47;

function configCancha(){
  const e0=estiloPz();let T={tipo:e0.tipo,lineas:e0.l,logo:e0.logo,op:e0.op,tam:e0.tam};const hayEsc=!!S.club.escudo;

    <div class="etq">Tipo de campo</div>

    <div style="display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:16px;align-items:start" class="cfg-cancha">
      <div class="cfg-ctl" style="display:flex;flex-direction:column;gap:14px;font-size:14px">
        <label>Color de las líneas<span style="display:flex;gap:8px;align-items:center;margin-top:4px"><input type="color" id="ccLin" value="${T.lineas}" style="width:48px;height:34px;padding:2px"><button type="button" class="btn chico" id="ccLinR">Original</button></span></label>
        <label class="chip" style="cursor:pointer;align-self:flex-start;${hayEsc?'':'opacity:.55'}"><input type="checkbox" id="ccLogo" ${T.logo&&hayEsc?'checked':''} ${hayEsc?'':'disabled'}> Escudo del club de fondo</label>
        ${hayEsc?'':'<p class="sub" style="margin:0;font-size:12px">Para usarlo, subí el escudo en Ajustes → Datos del club.</p>'}
        <label>Opacidad del escudo <b id="ccOpV">${T.op}%</b><input type="range" id="ccOp" style="width:100%;display:block" min="0" max="40" value="${T.op}"></label>
        <label>Tamaño del escudo <b id="ccTamV">${T.tam}%</b><input type="range" id="ccTam" style="width:100%;display:block" min="15" max="95" value="${T.tam}"></label>
      </div>
      <div class="cancha" id="ccPrev" style="padding:6px"></div>
    </div>
    <div class="modal-pie"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="ccOk">Guardar diseño</button></div>`,{ancho:true,alMontar:m=>{
      const prev=()=>{const e=est();$('#ccPrev',m).style.background=e.a;$('#ccPrev',m).innerHTML=svgPizarra(PZ||vacio,{estilo:e,frame:FR||0});$('#ccOpV',m).textContent=T.op+'%';$('#ccTamV',m).textContent=T.tam+'%'};
      $$('[data-est]',m).forEach(b=>b.onclick=()=>{T.tipo=b.dataset.est;T.lineas=ESTILOS_CANCHA[T.tipo].l;$('#ccLin',m).value=T.lineas;$$('[data-est]',m).forEach(x=>x.style.borderColor=x===b?'var(--tinta)':'transparent');prev()});
      $('#ccLin',m).oninput=e=>{T.lineas=e.target.value.toUpperCase();prev()};
      $('#ccLinR',m).onclick=()=>{T.lineas=ESTILOS_CANCHA[T.tipo].l;$('#ccLin',m).value=T.lineas;prev()};

      $('#ccOp',m).oninput=e=>{T.op=+e.target.value;prev()};
      $('#ccTam',m).oninput=e=>{T.tam=+e.target.value;prev()};
      $('#ccOk',m).onclick=()=>{S.club.pizarraEstilo={...T,lineas:T.lineas===ESTILOS_CANCHA[T.tipo].l?'':T.lineas};guardar();cerrarModal();aviso('Diseño de cancha guardado');pintar()};
      prev()}});

function setPos(e,x,y){if(FR===0){e.x=x;e.y=y}else{PZ.pasos[FR-1].pos[e.id]=[x,y]}}

    const ids=[...MULTI];
    box.innerHTML=`<div class="panel" style="margin-top:12px"><div class="panel-cab"><div><div class="etq">Seleccionadas</div><h3 style="margin-top:2px">${ids.length} piezas</h3></div><div class="der"><button class="btn chico fantasma" id="mX">Listo</button></div></div>

      <div class="colores">${PALETA.map(c=>`<button class="sw" data-mc="${c}" style="${c==='hueco'?'background:transparent;border:2px dashed var(--sub)':'background:'+c}" title="${c}"></button>`).join('')}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="btn chico" id="mDup">Duplicar</button><button class="btn chico" id="mUnir">Unir en línea</button><button class="btn chico peligro" id="mDel">Eliminar</button></div></div>`;
    $('#mX',box).onclick=()=>{MULTI.clear();redibujar();pintarSel()};

    <p class="sub" style="font-size:13px">Usa ${n} titulares ordenadas/os por posición. Después podés moverlas/os en la pizarra.</p>

      colocarEquipo(f,d.sistema,'der','#FFD400',true,ordenParaCancha(p.titulares.map(jugador).filter(Boolean))).forEach(e=>PZ.elementos.push(e));
      if(d.rival)colocarEquipo(f,d.sistema,'izq','#FFFFFF',true,null,'#141412').forEach(e=>{const [W]=FORMATOS[f];e.x=Math.max(e.x,W/2+2);PZ.elementos.push(e)});
      const sup=p.convocados.filter(id=>!p.titulares.includes(id)).map(jugador).filter(Boolean);
      if(d.sup&&sup.length){const [W,H]=FORMATOS[f];PZ.textos.push({id:uid(),x:W/2,y:H-1.5,txt:'Suplentes: '+ordenJ(sup).map(j=>(j.dorsal?j.dorsal+' ':'')+j.apellido).join(' · '),tam:.7})}

function pararAnim(repintarTodo){if(animando){cancelAnimationFrame(animando);animando=null;if(repintarTodo)pintar()}}
function reproducir(){
  const N=PZ.pasos.length;if(!N)return;SEL=null;pintarSel();
  const btn=$('#frPlay');if(btn)btn.textContent='■ Detener';
  const dur=1100,pausa=350,t0=performance.now();
  const paso=now=>{
    const t=now-t0,seg=Math.floor(t/(dur+pausa));
    if(seg>=N){animando=null;FR=N;pintar();return}
    const f=Math.min(1,(t-seg*(dur+pausa))/dur),e=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2,over={};
    PZ.elementos.forEach(el=>{const a=posEn(PZ,el,seg),b=posEn(PZ,el,seg+1);over[el.id]=[a[0]+(b[0]-a[0])*e,a[1]+(b[1]-a[1])*e]});
    const c=$('#cancha');if(!c){animando=null;return}
    c.innerHTML=svgPizarra(PZ,{frame:seg,over});
    const lbl=$('.pasos b');if(lbl)lbl.textContent='Paso '+(seg+1)+' → '+(seg+2)+' de '+(N+1);
    animando=requestAnimationFrame(paso);
  };
  animando=requestAnimationFrame(paso);
}
function exportarPng(){
  const txt=svgPizarra(PZ,{frame:FR});const [W,H]=FORMATOS[PZ.formato];const esc2=1600/Math.max(W,H),pad=Math.max(W,H)*.045;
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=Math.round((W+pad*2)*esc2);c.height=Math.round((H+pad*2)*esc2);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const url=c.toDataURL('image/png'),nom=(PZ.nombre||'ejercicio').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'ejercicio';
    modal('Imagen del ejercicio',`<img src="${url}" alt="${esc(PZ.nombre)}" style="width:100%;border-radius:8px"><p class="sub" style="margin:12px 0 0">${PZ.pasos.length?'Se exporta el paso que estás viendo. ':''}En el celular también podés mantener apretada la imagen para guardarla.</p><div class="modal-pie"><a class="btn pri" href="${url}" download="${nom}.png">Descargar imagen</a></div>`,{ancho:true})};

}

function camisetaSVG(k,tam=90){

function alineDe(p){

function inicioPrueba(){try{if(CLUBDOC&&CLUBDOC.creado&&CLUBDOC.creado.toDate)return CLUBDOC.creado.toDate()}catch(e){}
  if(!S.club.pruebaDesde){S.club.pruebaDesde=iso(HOY);guardar()}return deIso(S.club.pruebaDesde)}
function estadoPlan(){
  if(typeof MODO==='undefined'||MODO!=='nube'||!CLUB)return {tipo:'libre'};
  if(esDuenia())return {tipo:'libre'};
  if(!PLAN.cargado)return {tipo:'libre'};
  if(PLAN.pago&&(!PLAN.hasta||deIso(PLAN.hasta)>=HOY))return {tipo:'pago',hasta:PLAN.hasta};
  const fin=new Date(inicioPrueba().getTime()+DIAS_PRUEBA*864e5),quedan=Math.ceil((fin-new Date())/864e5);
  if(quedan>0)return {tipo:'prueba',quedan,fin};
  const g=S.club.gracia;if(g&&g.hasta&&deIso(g.hasta)>=HOY)return {tipo:'gracia',quedan:Math.max(1,Math.round((deIso(g.hasta)-HOY)/864e5))};
  return {tipo:'vencido',vencioPlan:PLAN.pago&&!!PLAN.hasta};
}

function abrirClub(clubId,recienCreado){

  let listos={club:false,datos:false,partidos:false,pizarras:false,fotos:false};
  if(!recienCreado)S={version:1,demo:false,contenidos:[...CONT_BASE],club:{nombre:'',categoria:'',temporada:String(HOY.getFullYear()),rama:'F',escudo:'',duracionTiempo:45},jugadores:[],tareas:[],pizarras:[],microciclos:[],sesiones:[],partidos:[],asistencia:{},evaluaciones:[]};

  },e=>{cortarSubs();if(e&&e.code==='permission-denied'){db.collection('usuarios').doc(USR.uid).set({clubId:firebase.firestore.FieldValue.delete()},{merge:true}).catch(()=>{});pantallaClub('Ya no formás parte de ese club.')}else pantallaClub(errTxt(e))}));
  subs.push(ref.collection('datos').onSnapshot(qs=>{
    let cambio=false;
    qs.docChanges().forEach(ch=>{const k=ch.doc.id;if(!COL_DOC.includes(k))return;const s=ch.doc.data().v;if(s===ultimo[k])return;
      if(listos.datos&&localSinSubir(k))return; // hay cambios propios sin subir: gana el último que guarda
      ultimo[k]=s;let v=JSON.parse(s);if(k==='jugadores')v=v.map(j=>({...j,foto:FOTOS[j.id]||''}));S[k]=v;cambio=true});
    if(!listos.datos&&qs.empty){if(!recienCreado){S=clubVacio();S.club.nombre=(CLUBDOC&&CLUBDOC.nombre)||'Mi club';if(CLUBDOC&&CLUBDOC.categoria)S.club.categoria=CLUBDOC.categoria;if(CLUBDOC&&CLUBDOC.rama)S.club.rama=CLUBDOC.rama}subirTodo()}
    if(cambio&&listos.datos)repintarRemoto();listo('datos');
  },e=>{pantallaCompleta(marcaGrande()+'<p class="acc-err">No se pudieron cargar los datos: '+esc(errTxt(e))+'</p><button class="btn" onclick="location.reload()">Reintentar</button>')}));
  COL_ITEMS.forEach(k=>subs.push(ref.collection(k).onSnapshot(qs=>{
    let cambio=false;
    qs.docChanges().forEach(ch=>{const id=ch.doc.id;if(ch.type==='removed'){if(ultimoItems[k][id]!==undefined){delete ultimoItems[k][id];S[k]=S[k].filter(x=>x.id!==id);cambio=true}return}
      const s=ch.doc.data().v;if(s===ultimoItems[k][id])return;const loc=S[k].find(x=>x.id===id);if(listos[k]&&loc&&JSON.stringify(loc)!==ultimoItems[k][id])return;
      ultimoItems[k][id]=s;const v=JSON.parse(s);if(k==='pizarras')normalizar(v);const i=S[k].findIndex(x=>x.id===id);if(i>=0)S[k][i]=v;else S[k].push(v);cambio=true});
    if(cambio&&listos[k])repintarRemoto();listo(k);
  },e=>aviso(errTxt(e)))));

    qs.docChanges().forEach(ch=>{const id=ch.doc.id;if(ch.type==='removed'){delete FOTOS[id];delete ultimoFoto[id]}else{FOTOS[id]=ch.doc.data().d||'';ultimoFoto[id]=FOTOS[id]}const j=S.jugadores.find(x=>x.id===id);if(j)j.foto=FOTOS[id]||''});
    if(listos.fotos)repintarRemoto();listo('fotos');
  },e=>{pantallaCompleta(marcaGrande()+'<p class="acc-err">No se pudieron cargar los datos: '+esc(errTxt(e))+'</p><button class="btn" onclick="location.reload()">Reintentar</button>')}));
}
function migrarNube(){S.jugadores.forEach(j=>j.foto=FOTOS[j.id]||j.foto||'');if(!S.contenidos||!S.contenidos.length)S.contenidos=[...CONT_BASE];S.pizarras.forEach(normalizar);if(CLUBDOC&&CLUBDOC.nombre&&!S.club.nombre)S.club.nombre=CLUBDOC.nombre;if(migrarTareasBase())guardar()}
function valorDoc(k){let v=S[k];if(k==='jugadores')v=v.map(j=>({...j,foto:''}));return JSON.stringify(v??null)}
function localSinSubir(k){return tSync&&valorDoc(k)!==ultimo[k]}
function repintarRemoto(){if($('#capaModal').innerHTML||(ruta==='pizarra')||(ruta==='partido'&&tabPartido==='vivo'&&pend)){pintarPend=true;return}pintar()}
function programarSync(){estadoNube('guardando');clearTimeout(tSync);tSync=setTimeout(sincronizar,700)}
const LIM_DOC=900000,TXE=new TextEncoder(),bytes=t=>TXE.encode(t).length,NOMBRE_DOC={club:'Datos del club',contenidos:'Contenidos',jugadores:'Plantel',tareas:'Biblioteca de tareas',microciclos:'Microciclos',sesiones:'Sesiones',asistencia:'Asistencia',evaluaciones:'Evaluaciones'};let avisoGrande=false;
async function sincronizar(){
  tSync=null;if(MODO!=='nube'||!CLUB)return;
  const ref=db.collection('clubes').doc(CLUB),ops=[],ts=firebase.firestore.FieldValue.serverTimestamp();
  const grandes=[];COL_DOC.forEach(k=>{const s=valorDoc(k);if(bytes(s)>LIM_DOC){grandes.push(k);return}if(s!==ultimo[k]){ultimo[k]=s;ops.push(b=>b.set(ref.collection('datos').doc(k),{v:s,t:ts,por:USR.uid}))}});
  COL_ITEMS.forEach(k=>{const vivos=new Set();S[k].forEach(it=>{vivos.add(it.id);const s=JSON.stringify(it);if(s!==ultimoItems[k][it.id]){ultimoItems[k][it.id]=s;ops.push(b=>b.set(ref.collection(k).doc(it.id),{v:s,t:ts,por:USR.uid}))}});
    Object.keys(ultimoItems[k]).forEach(id=>{if(!vivos.has(id)){delete ultimoItems[k][id];ops.push(b=>b.delete(ref.collection(k).doc(id)))}})});
  const ids=new Set(S.jugadores.map(j=>j.id));
  S.jugadores.forEach(j=>{const f=j.foto||'';if(f!==(ultimoFoto[j.id]||'')){ultimoFoto[j.id]=f;FOTOS[j.id]=f;ops.push(b=>f?b.set(ref.collection('fotos').doc(j.id),{d:f}):b.delete(ref.collection('fotos').doc(j.id)))}});
  Object.keys(ultimoFoto).forEach(id=>{if(!ids.has(id)){delete ultimoFoto[id];delete FOTOS[id];ops.push(b=>b.delete(ref.collection('fotos').doc(id)))}});
  if(grandes.length)aviso('No se pudo guardar en la nube: '+grandes.map(k=>NOMBRE_DOC[k]||k).join(', ')+' superó el espacio máximo. Borrá elementos viejos para liberar lugar.');
  else if(COL_DOC.some(k=>bytes(valorDoc(k))>LIM_DOC*.8)&&!avisoGrande){avisoGrande=true;aviso('Atención: '+COL_DOC.filter(k=>bytes(valorDoc(k))>LIM_DOC*.8).map(k=>NOMBRE_DOC[k]||k).join(', ')+' está cerca del límite de espacio en la nube.')}
  if(!ops.length){estadoNube(grandes.length?'error':'guardado');return}
  try{for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}estadoNube(grandes.length?'error':navigator.onLine===false?'offline':'guardado')}
  catch(e){estadoNube('error');aviso('No se pudo guardar en la nube: '+errTxt(e));ultimo={};Object.keys(ultimoItems).forEach(k=>ultimoItems[k]={})}
}
async function subirTodo(){ultimo={};ultimoItems={partidos:{},pizarras:{}};ultimoFoto={};await sincronizar()}

async function leerMaterial(x,btn){
  if(!x||!x.archivo)return;
  const t=btn.textContent;btn.disabled=true;btn.textContent='Abriendo…';
  try{
    const meta=await db.collection('lecturas-archivos').doc(x.archivo).get();
    const ps=await db.collection('lecturas-archivos').doc(x.archivo).collection('partes').get();
    const partes=ps.docs.slice().sort((a,b)=>Number(a.id)-Number(b.id)).map(d=>b64aBytes(d.data().d));
    const url=URL.createObjectURL(new Blob(partes,{type:(meta.exists&&meta.data().type)||'application/pdf'}));
    modal(x.titulo,`<iframe src="${url}" title="${esc(x.titulo)}" style="width:100%;height:70vh;border:0;border-radius:8px;background:#fff"></iframe><div class="modal-pie"><span class="sub" style="margin-right:auto;font-size:13px">Material de uso exclusivo para tu club.</span><a class="btn" href="${url}" target="_blank" rel="noopener">Abrir en pantalla completa</a></div>`,{ancho:true});
  }catch(e){aviso(e&&e.code==='permission-denied'?'Tu club no tiene el plan activo.':errTxt(e))}
  btn.disabled=false;btn.textContent=t;
}

    ['Metodika para clubes','Licencia para todo el cuerpo técnico del club, con acompañamiento para implementar la metodología.','A consultar',false,false]
  ];

/* ================= SUGERENCIAS (prueba con compañeras/os) ================= */
const MODULOS_SUG=[['general','General / otra'],['inicio','Inicio'],['plantel','Plantel'],['planificacion','Planificación'],['biblioteca','Biblioteca de tareas'],['lecturas','Lecturas'],['pizarra','Pizarra táctica'],['partido','Partido'],['analisis','Análisis de rival'],['videoanalisis','Videoanálisis'],['evaluaciones','Evaluaciones'],['fixture','Fixture'],['asistencia','Asistencia'],['ajustes','Ajustes / ingreso']];
function enviarSugerencia(){
  const modAct=MODULOS_SUG.some(m=>m[0]===ruta)?ruta:'general';
  modal('Enviar sugerencia',`<p class="sub" style="margin:0 0 12px">Contanos qué encontraste: un error, algo que no se entiende o una idea. Le llega directo a Metodika.</p>
  <form class="form" id="fSug">
    <label class="campo">Tipo<select name="tipo">${opts([['error','🐞 Algo no funciona'],['confuso','🤔 No se entiende'],['idea','💡 Idea o mejora'],['otro','💬 Otro comentario']],'error')}</select></label>
    <label class="campo">Módulo<select name="modulo">${opts(MODULOS_SUG,modAct)}</select></label>
    <label class="campo ancho">¿Qué pasó o qué propondrías?<textarea name="texto" rows="5" placeholder="Ej.: En la pizarra, al tocar el arco desde el celular no se mueve."></textarea></label>
  </form>
  <p class="sub" style="font-size:12px;margin:8px 0 0">Se envía junto con tu mail, el club y el tipo de dispositivo, para poder ubicar el problema.</p>
  <div class="modal-pie"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="okSug">Enviar</button></div>`,{alMontar:m=>{
    $('#okSug',m).onclick=async()=>{const d=leerForm($('#fSug',m));if(!d.texto.trim()){aviso('Escribí tu comentario.');return}
      const disp=(innerWidth<600?'Celular':innerWidth<1000?'Tablet':'Compu')+' · '+innerWidth+'×'+innerHeight+' · '+(navigator.userAgent.match(/(Android|iPhone|iPad|Windows|Mac OS X|Linux)/)||['?'])[0];
      const reg={tipo:d.tipo,modulo:d.modulo,texto:d.texto.trim().slice(0,3000),pantalla:ruta,dispositivo:disp,fecha:new Date().toISOString(),estado:'nueva',
        club:(S&&S.club&&S.club.nombre)||'',clubId:(typeof CLUB!=='undefined'&&CLUB)||'',email:(typeof USR!=='undefined'&&USR&&USR.email)||'',nombre:(typeof PERFIL!=='undefined'&&PERFIL&&PERFIL.nombre)||''};
      const b=$('#okSug',m);b.disabled=true;b.textContent='Enviando…';
      if(typeof MODO!=='undefined'&&MODO==='nube'&&USR){try{await db.collection('sugerencias').add({...reg,uid:USR.uid});cerrarModal();aviso('¡Gracias! Tu sugerencia llegó.');return}catch(e){console.warn(e)}}
      const tit={error:'Error',confuso:'No se entiende',idea:'Idea',otro:'Comentario'}[reg.tipo];
      const cuerpo=`${reg.texto}\n\n— Módulo: ${(MODULOS_SUG.find(x=>x[0]===reg.modulo)||[])[1]}\n— Club: ${reg.club}\n— Dispositivo: ${reg.dispositivo}`;
      location.href='mailto:'+CONTACTO_MAIL+'?subject='+encodeURIComponent('Metodika Clubes · '+tit)+'&body='+encodeURIComponent(cuerpo);
      cerrarModal();aviso('Se abrió tu correo para enviar la sugerencia.')};
  }});
}
let SUG_LISTA=null,SUG_FILTRO='nueva';
async function cargarSugerencias(){try{const q=await db.collection('sugerencias').orderBy('fecha','desc').limit(300).get();SUG_LISTA=q.docs.map(d=>({id:d.id,...d.data()}))}catch(e){console.warn(e);SUG_LISTA=[]}if(ruta==='ajustes')pintar()}
function panelSugerenciasHtml(){
  if(SUG_LISTA===null){cargarSugerencias();return `<div class="panel" style="margin-bottom:16px"><h3>Sugerencias de quienes prueban</h3><div class="sub">Cargando…</div></div>`}
  const ICS={error:'🐞',confuso:'🤔',idea:'💡',otro:'💬'},nModulo=k=>(MODULOS_SUG.find(x=>x[0]===k)||[,k])[1];
  const n={nueva:SUG_LISTA.filter(x=>x.estado!=='resuelta').length,resuelta:SUG_LISTA.filter(x=>x.estado==='resuelta').length};
  const lista=SUG_LISTA.filter(x=>SUG_FILTRO==='todas'||(SUG_FILTRO==='resuelta'?x.estado==='resuelta':x.estado!=='resuelta'));
  return `<div class="panel" style="margin-bottom:16px"><div class="panel-cab"><h3>Sugerencias de quienes prueban <span class="chip ama">${n.nueva} pendientes</span></h3><div class="der" style="display:flex;gap:6px;flex-wrap:wrap">
    <select id="sugF" style="width:auto">${opts([['nueva','Pendientes ('+n.nueva+')'],['resuelta','Resueltas ('+n.resuelta+')'],['todas','Todas']],SUG_FILTRO)}</select><button class="btn chico" id="sugR">↻ Actualizar</button></div></div>
    ${lista.length?`<div class="lista">${lista.map(x=>`<div class="fila" style="align-items:flex-start;gap:12px;padding:10px 0"><span style="font-size:20px">${ICS[x.tipo]||'💬'}</span><div style="flex:1;min-width:0"><div style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(x.texto)}</div>
      <div class="sub" style="font-size:12px;margin-top:4px">${esc(nModulo(x.modulo))} · ${esc(x.nombre||x.email||'—')}${x.club?' · '+esc(x.club):''} · ${esc(x.dispositivo||'')} · ${new Date(x.fecha).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${x.email?`<a class="btn chico" href="mailto:${esc(x.email)}?subject=${encodeURIComponent('Tu sugerencia en Metodika Clubes')}">Responder</a>`:''}<button class="btn chico" data-sres="${x.id}">${x.estado==='resuelta'?'↺ Reabrir':'✓ Resuelta'}</button><button class="btn chico fantasma" data-sdel="${x.id}" aria-label="Borrar">✕</button></div></div>`).join('')}</div>`:`<div class="vacio">${SUG_FILTRO==='nueva'?'No hay sugerencias pendientes.':'Nada por acá.'}</div>`}</div>`;
}
function conectarSugerencias(el){
  const f=$('#sugF',el);if(!f)return;
  f.onchange=e=>{SUG_FILTRO=e.target.value;pintar()};
  $('#sugR',el).onclick=()=>{SUG_LISTA=null;pintar()};
  $$('[data-sres]',el).forEach(b=>b.onclick=async()=>{const x=SUG_LISTA.find(y=>y.id===b.dataset.sres);const nuevo=x.estado==='resuelta'?'nueva':'resuelta';try{await db.collection('sugerencias').doc(x.id).update({estado:nuevo});x.estado=nuevo;pintar()}catch(e){aviso('No se pudo actualizar.')}});
  $$('[data-sdel]',el).forEach(b=>b.onclick=()=>confirmar('¿Borrar esta sugerencia?','No se puede deshacer.','Borrar',async()=>{try{await db.collection('sugerencias').doc(b.dataset.sdel).delete();SUG_LISTA=SUG_LISTA.filter(y=>y.id!==b.dataset.sdel);pintar()}catch(e){aviso('No se pudo borrar.')}}));
}
VISTAS.ajustes=el=>{
  const c=S.club;let esc0=c.escudo;
  let tema='';try{tema=localStorage.getItem('metodika_tema')||''}catch(e){}
  const nube=MODO==='nube';
  el.innerHTML=cabecera('Configuración','Ajustes','')+(nube&&esDuenia()?panelSugerenciasHtml():'')+(nube?panelEquipoHtml():'')+
  `<div class="grilla g2" style="align-items:start"><div class="panel"><h3>Datos del club</h3><form class="form" id="fC" style="margin-top:6px">
    <div class="ancho" style="display:flex;gap:14px;align-items:center"><div class="av g" id="prevEsc">${c.escudo?`<img src="${c.escudo}" alt="">`:'?'}</div><label class="btn chico" for="escF">Subir escudo</label><input type="file" id="escF" accept="image/*" hidden></div>
    <label class="campo ancho">Nombre del club<input type="text" id="cn" name="nombre" value="${esc(c.nombre)}"></label>
    <label class="campo">Categoría o equipo<input type="text" id="cc" name="categoria" value="${esc(c.categoria)}"></label>
    <label class="campo">Temporada<input type="text" id="ct" name="temporada" value="${esc(c.temporada)}"></label>
    <label class="campo">Rama<select id="cr" name="rama">${opts([['F','Femenino (jugadoras)'],['M','Masculino (jugadores)'],['X','Mixto (jugadoras/es)']],c.rama)}</select></label>
    <label class="campo">Minutos por tiempo<input type="number" id="cd" name="duracionTiempo" min="10" max="60" value="${c.duracionTiempo||45}"></label>
  </form><div class="modal-pie"><button class="btn pri" id="gC">Guardar</button></div></div>
  <div style="display:flex;flex-direction:column;gap:16px">
    <div class="panel"><h3>Apariencia</h3><div class="seg" style="margin-top:4px">${[['','Automático'],['light','Claro'],['dark','Oscuro']].map(([v,t])=>`<button data-tema="${v}" class="${tema===v?'activo':''}">${t}</button>`).join('')}</div></div>
    <div class="panel"><h3>Contenidos de entrenamiento</h3><p class="sub" style="margin:0 0 10px;font-size:14px">Son los conceptos que usás en sesiones, microciclos y tareas. Agregá los de tu metodología.</p>
      <div class="chips" id="listaCont">${CONT().map(c=>`<span class="chip">${esc(c)} <button type="button" class="btn fantasma chico" style="padding:0 2px;font-size:12px" data-qc="${esc(c)}" aria-label="Quitar ${esc(c)}">✕</button></span>`).join('')}</div>
      <div style="display:flex;gap:6px;margin-top:10px;max-width:380px"><input type="text" id="aCont" placeholder="Nuevo concepto, ej.: Salida de juego" aria-label="Nuevo concepto"><button class="btn chico" id="aContB">＋ Agregar</button></div></div>
    <div class="panel"><h3>Copia de seguridad</h3><p class="sub" style="margin:0 0 12px;font-size:14px">${nube?'Los datos del club se guardan en la nube y los ve todo el cuerpo técnico. Igual podés guardar una copia en tu compu.':'Los datos se guardan en este dispositivo y navegador. Hacé una copia cada tanto para no perderlos o para pasarlos a otra compu.'}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="desD">Descargar copia</button><button class="btn" id="expD">Copiar mis datos</button>${nube&&!esAdmin()?'':'<label class="btn" for="impF">Restaurar desde archivo</label><input type="file" id="impF" accept=".json,application/json,text/plain" hidden>'}${nube&&!esAdmin()?'':'<button class="btn" id="impT">Pegar copia</button>'}</div></div>
    ${nube&&!esAdmin()?'':`<div class="panel"><h3>Empezar de nuevo</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${nube?'':'<button class="btn" id="verDemo">Cargar club de ejemplo</button>'}<button class="btn peligro" id="vaciar">Borrar todo y empezar de cero</button></div></div>`}
  </div></div>`;
  const addA=()=>{const n=agregarContenido($('#aCont').value);if(n){aviso('Concepto agregado: '+n);pintar()}};
  conectarSugerencias(el);
  $('#aContB').onclick=addA;$('#aCont').onkeydown=e=>{if(e.key==='Enter')addA()};
  $$('[data-qc]').forEach(b=>b.onclick=()=>{const c=b.dataset.qc;if(CONT().length<=1){aviso('Tiene que quedar al menos un concepto.');return}const usos=S.tareas.filter(t=>t.contenido===c).length+S.sesiones.filter(s=>contSes(s).includes(c)).length;confirmar('¿Quitar “'+c+'”?',usos?'Se usa en '+usos+' tareas o sesiones. Esas quedan como están; solo deja de aparecer en la lista para elegir.':'Deja de aparecer en la lista para elegir.','Quitar',()=>{S.contenidos=CONT().filter(x=>x!==c);guardar();pintar()})});
  $('#escF').onchange=e=>{const f=e.target.files[0];if(f)reducirFoto(f,d=>{esc0=d;$('#prevEsc').innerHTML=`<img src="${d}" alt="">`})};
  $('#gC').onclick=()=>{const d=leerForm($('#fC'));Object.assign(S.club,d,{duracionTiempo:+d.duracionTiempo||45,escudo:esc0});guardar();if(nube&&esAdmin()&&CLUBDOC.nombre!==S.club.nombre)db.collection('clubes').doc(CLUB).update({nombre:S.club.nombre}).catch(()=>{});aviso('Datos del club guardados');pintar()};
  conectarPanelEquipo(el);
  $$('[data-tema]').forEach(b=>b.onclick=()=>{const v=b.dataset.tema;try{v?localStorage.setItem('metodika_tema',v):localStorage.removeItem('metodika_tema')}catch(e){}aplicarTema();pintar()});
  $('#desD').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='metodika-copia-'+iso(HOY)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);aviso('Copia descargada')};
  $('#expD').onclick=()=>{const txt=JSON.stringify(S);modal('Copia de tus datos',`<p class="sub" style="margin:0 0 10px">Copiá este texto y guardalo en un archivo de texto (por ejemplo en el Bloc de notas) con el nombre <b>metodika-copia.json</b>.</p><textarea id="txtD" readonly style="min-height:200px;font-family:monospace;font-size:12px">${escRaw(txt)}</textarea><div class="modal-pie"><button class="btn pri" id="copD">Copiar</button></div>`,{alMontar:m=>$('#copD',m).onclick=()=>{const ta=$('#txtD',m);navigator.clipboard.writeText(txt).then(()=>aviso('Copiado'),()=>{ta.focus();ta.select();aviso('Seleccionado: apretá Ctrl + C')})}})};
  const restaurar=txt=>{try{const d=JSON.parse(txt);if(!d.club||!Array.isArray(d.jugadores))throw 0;confirmar('¿Restaurar esta copia?','Reemplaza todos los datos actuales por los de la copia.','Restaurar',()=>{S=d;migrar();migrarTareasBase();guardar();ir('inicio');aviso('Datos restaurados')})}catch(e){aviso('El archivo no es una copia válida de Metodika.')}};
  if($('#impF'))$('#impF').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restaurar(r.result);r.readAsText(f)};
  if($('#impT'))$('#impT').onclick=()=>modal('Pegar copia',`<textarea id="pegD" style="min-height:200px;font-family:monospace;font-size:12px" placeholder="Pegá acá el texto de la copia"></textarea><div class="modal-pie"><button class="btn" data-cerrar>Cancelar</button><button class="btn pri" id="okP">Restaurar</button></div>`,{alMontar:m=>$('#okP',m).onclick=()=>{const v=$('#pegD',m).value;cerrarModal();restaurar(v)}});
  if($('#verDemo'))$('#verDemo').onclick=()=>confirmar('¿Cargar el club de ejemplo?','Reemplaza los datos actuales por el club ficticio.','Cargar ejemplo',()=>{S=crearDemo();guardar();ir('inicio')});
  if($('#vaciar'))$('#vaciar').onclick=()=>confirmar('¿Borrar todo?','Se eliminan plantel, sesiones, partidos, asistencia y evaluaciones. Hacé una copia antes si la necesitás.','Borrar todo',()=>{S=clubVacio();guardar();ir('ajustes');aviso('Listo. Empezá cargando los datos del club.')});
};
function aplicarTema(){let t='';try{t=localStorage.getItem('metodika_tema')||''}catch(e){}if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}

/* ================= ARRANQUE ================= */
aplicarTema();
if(nubeDisponible()){S=crearDemo();iniciarNube()}
else{
  S=cargar()||crearDemo();
  if(!cargar())guardar();
  migrar();
  if(migrarTareasBase())guardar();
  S.pizarras.forEach(normalizar);
  {const h=(location.hash||'').replace('#','');if(VISTAS[h])ruta=h}
  pintar();
}

</script>
